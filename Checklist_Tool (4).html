}

function demoFoto(b, groot = false) {
  let s = hashTekst(b.naam);
  const r = (k) => ((s = (s * 1664525 + 1013904223) >>> 0) % k);
  const binnen = /keuken|badkamer|slaapkamer|woonkamer|trappen|berging|cv|vloer|kamer|technisch/i.test(b.naam);
  if (binnen) {
    const muur = ["#E9E4DC", "#DDE3E6", "#EFE9DF", "#E2DED8"][r(4)], vloer = ["#B99A78", "#9C8E80", "#C8B79F"][r(3)];
    return `<svg class="${groot ? "groot" : ""}" viewBox="0 0 160 120" role="img" aria-label="${esc(b.naam)}"><rect width="160" height="120" fill="${muur}"/><path d="M0 84 L160 84 L160 120 L0 120Z" fill="${vloer}"/><rect x="${20 + r(60)}" y="22" width="44" height="40" fill="#CFE3F1" stroke="#fff" stroke-width="3"/><rect x="${6 + r(30)}" y="66" width="${30 + r(40)}" height="22" rx="2" fill="#7F8C8D" opacity=".75"/></svg>`;
  }
  const lucht = 196 + r(24), gevel = ["#B7774F", "#C9B8A0", "#8D7B6A", "#D8CFC4", "#9E5B3C", "#7E8B92"][r(6)];
  const kol = 3 + r(3), rij = 2 + r(2), x0 = 18 + r(16), w = 160 - x0 * 2;
  let ramen = "";
  for (let i = 0; i < kol; i++) for (let j = 0; j < rij; j++) ramen += `<rect x="${x0 + 8 + i * ((w - 16) / kol)}" y="${32 + j * 16}" width="${(w - 16) / kol - 7}" height="10" fill="#DDE9F2" opacity=".92"/>`;
  return `<svg class="${groot ? "groot" : ""}" viewBox="0 0 160 120" role="img" aria-label="${esc(b.naam)}"><defs><linearGradient id="l${s % 9999}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${lucht} 60% 72%)"/><stop offset="1" stop-color="hsl(${lucht} 50% 90%)"/></linearGradient></defs><rect width="160" height="120" fill="url(#l${s % 9999})"/><rect x="${x0}" y="22" width="${w}" height="${36 + rij * 16}" fill="${gevel}"/>${ramen}<rect x="${74 + r(10)}" y="${58 + rij * 16 - 22}" width="13" height="22" fill="#4A3F38"/><rect y="${58 + rij * 16}" width="160" height="${62 - rij * 16}" fill="#9AA0A6"/></svg>`;
}

function demoVoorbeeld(vak, b, p) {
  const e = b.ext;
  if (isBeeld(e) && !/bestemming|plankaart|\bkaart\b|regels/.test(b.naamN + " " + b.mapN)) { vak.innerHTML = `<div class="vbbeeld">${demoFoto(b, true)}</div>`; return; }
  if (e === "msg" || e === "eml") { vak.innerHTML = mailKaart(demoMail(b), b); return; }
  if (["xlsx", "xlsm", "xls", "xlsb"].includes(e)) { excelVak(vak, demoWerkmap(b), p, b); return; }
  if (e === "docx" || e === "doc") { vak.innerHTML = docxKaart(demoDocx(b), b); return; }
  if (e === "pdf" || isBeeld(e)) { vak.innerHTML = `<div class="papierwrap"><div class="papier">${demoPapier(b)}</div></div>`; return; }
  vak.innerHTML = bestandKaart(b);
}

const UI = { scherm: "dossier", fout: null };
const STATUS_TEKST = { ok: "Akkoord", nvt: "N.v.t.", mist: "Ontbreekt", deels: "Deels", open: "Open" };
const STATUS_TEKST_AUTO = { ok: "In orde", nvt: "N.v.t.", mist: "Niet in orde", deels: "Deels", open: "Open" };
const statusTekst = (p, s) => (p && p.auto ? STATUS_TEKST_AUTO : STATUS_TEKST)[s || "open"];
const sectieVan = (id) => SECTIES.find((s) => s.id === id);
const sectieLabel = (s) => (s.nr ? `${s.nr} · ${s.titel}` : s.titel);

function statusIkoon(s, n = 12) {
  if (s === "ok") return svgVink(n, 3);
  if (s === "mist") return svgKruis(n);

/* ---------------- algemeen ---------------- */
function melding(tekst, soort = "") {
  const m = $("#melding");
  m.className = `toast ${soort}`;
  m.innerHTML = tekst;
  clearTimeout(melding.t);
  melding.t = setTimeout(() => m.classList.add("verborgen"), 2800);
}
function openVenster({ titel, tekst = "", lijf = "", knoppen = [], breed = false }) {
  const v = $("#venster");
  v.innerHTML = `<div class="vdoos ${breed ? "breed" : "smal"}" role="dialog" aria-modal="true" aria-labelledby="vTitel">
    <div class="vkop"><h2 id="vTitel">${titel}</h2>${tekst ? `<p>${tekst}</p>` : ""}</div>
    ${lijf ? `<div class="vlijf">${lijf}</div>` : ""}
    <div class="vvoet"><div class="rest">${knoppen.map((k, i) => `<button class="k ${k.klasse || "stil"}" data-vk="${i}">${k.tekst}</button>`).join("")}</div></div>
  </div>`;
  v.classList.remove("verborgen");
  $$("[data-vk]", v).forEach((b) => b.addEventListener("click", () => { const k = knoppen[+b.dataset.vk]; if (!k.actie || k.actie() !== false) sluitVenster(); }));
  v.onclick = (e) => { if (e.target === v) sluitVenster(); };
  setTimeout(() => ($("input", v) || $(".k.cta, .k.vol", v) || $("button", v))?.focus(), 30);
}
function sluitVenster() { $("#venster").classList.add("verborgen"); $("#venster").innerHTML = ""; }
/* Voortgang: wat de tool leest, waar hij is, en een balk. */
function voortgang(st) {
  let o = $("#bezig");
  if (!st) { o?.remove(); return; }
  if (!o) {
    o = document.createElement("div"); o.id = "bezig"; o.className = "bezig";
    o.innerHTML = `<div class="bzdoos" role="status" aria-live="polite"><div class="bzkop"><span class="bzdraai" aria-hidden="true"></span><div class="bzt"><b class="bztitel"></b><span class="bztekst"></span></div></div><div class="bzbalk onbepaald"><i></i></div><div class="bzvoet"><span class="bznoot"></span><button class="k stil bzstop" type="button">Stoppen</button></div></div>`;
    document.body.appendChild(o);
    $(".bzstop", o).addEventListener("click", (e) => { STOP.aan = true; e.currentTarget.disabled = true; e.currentTarget.textContent = "Stoppen…"; });
  }
  if (st.titel != null) $(".bztitel", o).textContent = st.titel;
  if (st.tekst != null) $(".bztekst", o).textContent = st.tekst;
  if (st.noot != null) $(".bznoot", o).textContent = st.noot;
  const balk = $(".bzbalk", o);
  if (st.deel == null) balk.classList.add("onbepaald");
  else { balk.classList.remove("onbepaald"); $("i", balk).style.width = `${Math.max(2, Math.round(st.deel * 100))}%`; }
  if (st.stopbaar != null) $(".bzstop", o).hidden = !st.stopbaar;
}
function bezig(tekst) { voortgang(tekst ? { titel: tekst, tekst: "", noot: "", deel: null, stopbaar: false } : null); }
const sec = (t0) => `${((performance.now() - t0) / 1000).toLocaleString("nl-NL", { maximumFractionDigits: 1 })} s`;

function toonScherm(naam) {
  if (naam !== "dossier" && !S.bron) naam = "dossier";
  UI.scherm = naam;
  $$(".scherm").forEach((s) => s.classList.toggle("verborgen", s.id !== `s-${naam}`));
  tekenKop();
  if (naam === "dossier") tekenDossier();
  if (naam === "controle") tekenControle();
  if (naam === "overzicht") tekenOverzicht();
  if (naam === "a4") tekenA4();
  const sc = $(`#s-${naam}`); if (sc) sc.scrollTop = 0;
  try { if (location.hash !== `#${naam}`) history.replaceState(null, "", `#${naam}`); } catch {}
}

function kopContext() {
  if (!S.bron) return "";
  const d = S.dossier;
  if (S.type === "portefeuille") return `<b>${esc(d.projectnaam || S.bron.naam)}</b> · ${S.objecten.length < S.objectenAlle.length ? `${S.objecten.length} van ${S.objectenAlle.length} objecten` : meervoud(S.objecten.length, "object", "objecten")}`;
  const o = S.objecten[0] || {};
  return `<b>${esc(d.dossiernummer || o.nr || S.bron.naam)}</b>${o.adres ? ` · ${esc(o.adres)}${o.plaats ? ", " + esc(o.plaats) : ""}` : ""}`;
}
function tekenKop() {
  const t = S.bron ? tellingen() : null;
  $$("#stappen button").forEach((b) => {
    const s = b.dataset.stap;
    b.classList.toggle("aan", s === UI.scherm);
    b.disabled = s !== "dossier" && !S.bron;
    const klaar = (s === "dossier" && S.bron) || (s === "controle" && t && t.open === 0);
    b.innerHTML = `${klaar ? `<span class="stapvink">${svgVink(9, 3.4)}</span>` : ""}${b.dataset.label}`;
  });
  $("#kopcontext").innerHTML = kopContext() + (S.bron?.demo ? ` <span class="st demo">fictief</span>` : "");
  $("#stand").textContent = t ? `${t.klaar} van ${t.totaal} nagelopen` : "";
}

/* ---------------- 1 · DOSSIER ---------------- */
function svgGebouw(n) {
  const een = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.6"/>${Array.from({ length: Math.floor((h - 9) / 6) }, (_, i) => `<path d="M${x + 3.5} ${y + 5 + i * 6}h${w - 7}" stroke-dasharray="2.4 2.6"/>`).join("")}`;
  const inhoud = n === 1 ? een(15, 7, 18, 33) : een(4, 17, 12, 23) + een(18, 7, 13, 33) + een(33, 21, 11, 19);
  return `<svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inhoud}<path d="M2 40.5h44"/></svg>`;
}
const soortNaam = (t) => (t === "portefeuille" ? "Portefeuille" : "Enkel object");

function tekenDossier() {
  const vak = $("#dossierInhoud");
  if (!S.bron && !S.keuze) {
    vak.innerHTML = startTegels();
    $("#dossierVoet").innerHTML = `<span class="samen">Kies eerst het soort dossier</span>`;
    return;
  }
  if (!S.bron) {
    vak.innerHTML = mapKiezen();
    $("#dossierVoet").innerHTML = `<span class="samen">${soortNaam(S.keuze)} · nog geen map gekozen</span>`;
    return;
  }
  const t = tellingen();
  vak.innerHTML = `
    <div class="dataintro">
      <div>
        <div class="keuzelabel">${soortNaam(S.type)}</div>
        <h1>${S.type === "portefeuille" ? "Portefeuille" : "Dossier"} ${esc(S.type === "portefeuille" ? S.dossier.projectnaam || S.bron.naam : S.dossier.dossiernummer || S.bron.naam)}</h1>
        <p>${S.type === "portefeuille" ? "Kijk of de goede objecten meedoen en vul de gegevens aan die op de pdf komen." : "Vul de gegevens aan die op de pdf komen, en start de controle."}</p>
      </div>
      <div class="rechtsin"><button class="k stil" data-actie="nieuwdossier">Ander dossier</button></div>
    </div>
    ${typeWaarschuwing()}
    ${bronKaart()}
    ${S.type === "portefeuille" ? objectenKiezen() : ""}
    ${gegevensFormulier()}`;
  $("#dossierVoet").innerHTML = `<span class="samen"><b>${meervoud(S.bestanden.filter((b) => !b.systeem).length, "bestand", "bestanden")}</b> · ${t.open ? `${meervoud(t.open, "punt", "punten")} om na te kijken` : "alles nagelopen"}${t.auto ? ` · ${t.auto} automatisch afgevinkt` : ""}</span><div class="rest"><button class="k cta" data-stap="controle">${PUNTEN.some((p) => S.punten[p.id].status && !S.punten[p.id].auto) ? "Verder met de controle" : "Start de controle"}</button></div>`;
}

function startTegels() {
  return `
    <div class="startkop">
      <h1>Wat ga je controleren?</h1>
      <p>Kies het soort dossier en daarna de map. De tool leest alleen de namen van de bestanden; een bestand gaat pas open als je erop klikt. Alles blijft op deze pc.</p>
    </div>
    <div class="keuzetegels">
      <button class="ktegel" data-kies="enkel">
        <span class="kticoon">${svgGebouw(1)}</span>
        <b>Enkel object</b>
        <span class="ktuitleg">Eén object in één dossiermap, zoals T:\\Archief\\2026\\…\\12110.</span>
        <span class="ktvoet">${svgVink(11, 3)} Voorbeeld van elk bestand · checklist op één A4</span>
      </button>
      <button class="ktegel" data-kies="portefeuille">
        <span class="kticoon">${svgGebouw(3)}</span>
        <b>Portefeuille</b>
        <span class="ktuitleg">Meerdere objecten in één map, met per object een submap (12539, 12540 …).</span>

}

function mapKiezen() {

function objectenKiezen() {
  const n = S.objecten.length, tot = S.objectenAlle.length;
  return `<section class="paneel objkeuze">

function bronKaart() {
  const b = S.bron, best = S.bestanden.filter((x) => !x.systeem);
  const mappen = new Set(best.map((x) => x.map).filter(Boolean)).size;
  const alleGroottes = best.every((x) => x.grootte != null);
  const totaal = alleGroottes ? best.reduce((s, x) => s + (x.grootte || 0), 0) : 0;
  const bronTekst = { map: "map gekozen, alleen namen gelezen", inventaris: `inventarisatie${b.gemaakt ? " van " + esc(b.gemaakt) : ""}`, plak: "lijst met paden", demo: "voorbeelddossier" }[b.soort] || "";
  return `<section class="paneel bron">
    <div class="bronkop">
      <span class="bronikoon">${svgMap(20)}</span>
      <div class="brontekst"><h2>${esc(b.naam)} ${b.demo ? '<span class="st demo">fictief</span>' : ""}</h2><p>${esc(b.root || "")}${b.root ? " · " : ""}${bronTekst}</p></div>
    </div>
    <div class="bronfeiten">
      <div><b class="bn">${nl(best.length)}</b><span>bestanden</span></div>
      <div><b class="bn">${nl(mappen)}</b><span>mappen</span></div>
      ${totaal ? `<div><b class="bn">${esc(grootteTekst(totaal))}</b><span>totaal</span></div>` : ""}
      ${S.type === "portefeuille" ? `<div><b class="bn">${S.objecten.length}<small>/${S.objectenAlle.length}</small></b><span>objecten mee</span></div>` : ""}
    </div>
    <label class="schakel" for="autoSchakel"><input type="checkbox" id="autoSchakel" ${S.autoAan ? "checked" : ""}><span class="sk" aria-hidden="true"></span><span class="sktekst"><b>Zekere punten automatisch afvinken${S.autoAan ? ` <span class="st klaar">${tellingen().auto} van ${PUNTEN.length}</span>` : ""}</b><span>Alleen als de naam én de map kloppen. De ondertekening, het tabblad met de onderbouwing en de parafen kijk je altijd zelf na.</span></span></label>
  </section>`;
}

function veld(id, label, waarde, { hint = "", plaats = "", breed = false, alleenLezen = false } = {}) {
  return `<div class="vld ${breed ? "breed" : ""}"><label for="v-${id}">${label}</label><input id="v-${id}" data-veld="${id}" value="${esc(waarde)}" placeholder="${esc(plaats)}" ${alleenLezen ? "readonly" : ""} autocomplete="off">${hint ? `<div class="hint">${hint}</div>` : ""}</div>`;
}
function keuzes(id, opties, waarde, { meer = false } = {}) {
  const w = meer ? waarde || [] : [waarde];
  return `<div class="keuzes" data-keuze="${id}" ${meer ? 'data-meer="1"' : ""} role="group">${opties.map((o) => `<button type="button" class="keuze ${w.includes(o) ? "aan" : ""}" data-waarde="${esc(o)}" aria-pressed="${w.includes(o)}">${esc(o)}</button>`).join("")}</div>`;
}
/* Personen: knoppen uit het TEAM-blok, plus een open veld voor wie er niet in staat. */
function personenOpties(id) {
  if (id === "taxateurs") return { lijst: teamMet("taxateur"), meer: true, plaats: "Andere taxateur…" };
  if (id === "ingevuldDoor") return { lijst: TEAM, meer: false, plaats: "Andere naam…" };
  return { lijst: teamMet(PUNTEN[S.huidig].paraaf === "secretariaat" ? "secretariaat" : "taxateur"), meer: false, plaats: "Andere initialen…" };
}
function personenWaarde(id) { return id === "paraaf" ? S.punten[PUNTEN[S.huidig].id].paraaf.initialen : S.dossier[id]; }
function persoonKnop(p, aan) {
  return `<button type="button" class="keuze persoon ${aan ? "aan" : ""}" data-waarde="${esc(p.ini)}" aria-pressed="${aan}"><b>${esc(p.ini)}</b>${p.naam ? `<span>${esc(p.naam)}</span>` : ""}</button>`;
}
function losKnop(x) {
  const p = teamLid(x);
  return `<button type="button" class="keuze aan los" data-weg="${esc(x)}" title="Weghalen" aria-label="${esc(persoonTekst(x))} weghalen">${p ? `<b>${esc(p.ini)}</b>${p.naam ? `<span>${esc(p.naam)}</span>` : ""}` : esc(x)}<i aria-hidden="true">×</i></button>`;
}
function personen(id) {
  const { lijst, meer, plaats } = personenOpties(id);
  const v = personenWaarde(id);
  const w = meer ? v || [] : v ? [v] : [];
  const los = w.filter((x) => !lijst.some((p) => zelfde(p.ini, x)));
  return `<div class="keuzes personen" data-keuze="${id}" ${meer ? 'data-meer="1"' : ""} role="group">${lijst.map((p) => persoonKnop(p, w.some((x) => zelfde(x, p.ini)))).join("")}${meer ? los.map(losKnop).join("") : ""}<input class="anders ${!meer && los.length ? "gevuld" : ""}" ${id === "paraaf" ? 'id="paraafAnders"' : ""} data-anders="${id}" value="${esc(meer ? "" : los[0] || "")}" placeholder="${esc(plaats)}" aria-label="${esc(plaats.replace("…", ""))}" autocomplete="off" spellcheck="false"></div>`;
}
function ordenPersonen(l) {
  const plek = (x) => { const i = TEAM.findIndex((p) => zelfde(p.ini, x)); return i < 0 ? 1e6 : i; };
  return l.map((x, i) => [x, i]).sort((a, b) => plek(a[0]) - plek(b[0]) || a[1] - b[1]).map((x) => x[0]);
}
function zetPersoon(id, w) {
  if (id === "paraaf") { const st = S.punten[PUNTEN[S.huidig].id]; st.paraaf.initialen = w; if (w && !st.paraaf.datum) st.paraaf.datum = datumNL(new Date()); }
  else S.dossier[id] = w;
  bewaarStil(); tekenKop();
}
function voegPersoonToe(id, tekst) {
  const nieuw = String(tekst ?? "").split(/[,;]/).map(normPersoon).filter(Boolean);
  const l = [...(S.dossier[id] || [])];
  for (const w of nieuw) if (!l.some((x) => zelfde(x, w))) l.push(w);
  S.dossier[id] = ordenPersonen(l);
  bewaarStil(); tekenKop();
  verversPersonen(id);
}
/* Bijwerken zonder het veld te vervangen: dan blijven de focus en een klik op een knop werken. */
function verversPersonen(id) {
  const groep = $(`.personen[data-keuze="${id}"]`); if (!groep) return;
  const { lijst, meer } = personenOpties(id);
  const v = personenWaarde(id);
  const w = meer ? v || [] : v ? [v] : [];
  $$(".keuze[data-waarde]", groep).forEach((b) => { const aan = w.some((x) => zelfde(x, b.dataset.waarde)); b.classList.toggle("aan", aan); b.setAttribute("aria-pressed", aan); });
  const veld = $("[data-anders]", groep);
  if (meer) {
    $$(".keuze.los", groep).forEach((x) => x.remove());
    const t = document.createElement("template");
    t.innerHTML = w.filter((x) => !lijst.some((p) => zelfde(p.ini, x))).map(losKnop).join("");
    groep.insertBefore(t.content, veld);
  } else veld?.classList.toggle("gevuld", !!w.length && !lijst.some((p) => zelfde(p.ini, w[0])));
  if (id === "paraaf") { const vd = $("#puntKop .vondst"); if (vd) vd.innerHTML = paraafStand(S.punten[PUNTEN[S.huidig].id]); }
}
const paraafStand = (st) => (st.paraaf.initialen ? `<span class="st klaar">${svgVink(10)} Paraaf ${esc(st.paraaf.initialen)}</span>` : `<span class="st open">Kies de initialen</span>`);
function gegevensFormulier() {
  const d = S.dossier;
  const port = S.type === "portefeuille";
  return `<section class="paneel gegevens">
    <div class="paneelkop"><h2>Dossiergegevens</h2><span class="aantal">komen op de pdf</span></div>
    <div class="vldraster">
      ${veld("jaar", "Jaar", d.jaar)}
      ${veld("opdrachtgever", "Opdrachtgever", d.opdrachtgever, { plaats: "bijvoorbeeld de bank" })}
      ${veld("projectnaam", "Projectnaam <span class=\"optioneel\">(klant als de opdrachtgever een bank is)</span>", d.projectnaam)}
      ${veld("dossiernummer", port ? "Dossiernummers" : "Dossiernummer", d.dossiernummer, { alleenLezen: port })}
      ${veld("versie", "Versienummer", d.versie)}
      ${veld("flowId", "FLOW ID", d.flowId)}
      ${veld("pad", "Pad van de map <span class=\"optioneel\">(voor jaar, opdrachtgever en padlengte)</span>", d.pad, { breed: true, plaats: "T:\\Archief\\2026\\…", hint: "Klik in Verkenner op de adresbalk, kopieer (Ctrl+C) en plak het hier." })}
      <div class="vld breed"><label>Type taxatie</label>${keuzes("typeTaxatie", INSTELLINGEN.typeTaxatie, d.typeTaxatie)}</div>
      <div class="vld"><label>High risk?</label>${keuzes("highRisk", ["ja", "nee"], d.highRisk)}<details class="uitklap"><summary>Wat is high risk?</summary><ul class="hrlijst">${INSTELLINGEN.highRiskUitleg.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details></div>
      <div class="vld"><label>Terugkerend</label>${keuzes("terugkerend", INSTELLINGEN.terugkerend, d.terugkerend)}</div>
      <div class="vld breed"><label>Taxateurs <span class="optioneel">(kies, of typ een naam en druk op Enter)</span></label>${personen("taxateurs")}</div>
      <div class="vld breed"><label>Checklist ingevuld door</label>${personen("ingevuldDoor")}${MODUS === "bestand" ? `<div class="hint">De vaste namen en rollen staan bovenaan in dit bestand, in het blok TEAM. Open het in Kladblok om iemand toe te voegen.</div>` : ""}</div>
    </div>
  </section>`;
}
/* ---------------- 2 · CONTROLE ---------------- */
function tekenControle() { tekenRail(); tekenPunt(); }

function tekenRail() {
  const t = tellingen();
  const pct = Math.round((t.klaar / t.totaal) * 100);
  let h = `<div class="railkop"><div class="vgtekst"><b>${t.klaar}</b> van ${t.totaal} nagelopen</div><div class="vgbalk" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${t.auto ? `<div class="vgauto"><span class="ri auto">${svgVink(9, 3.2)}</span>${t.auto} automatisch · <b>${t.open}</b> nakijken</div>` : ""}</div>`;
  for (const s of SECTIES) {
    const punten = PUNTEN.map((p, i) => ({ p, i })).filter((x) => x.p.sectie === s.id);
    const klaar = punten.filter((x) => S.punten[x.p.id].status).length;
    h += `<div class="railsectie"><div class="rslabel"><span>${esc(sectieLabel(s))}</span><span>${klaar}/${punten.length}</span></div>`;
    for (const { p, i } of punten) {
      const st = S.punten[p.id].status || "open";
      const auto = S.punten[p.id].auto;
      const vs = st === "open" ? voorstel(p).soort : null;
      h += `<button class="rpunt s-${st} ${auto ? "auto" : ""} ${i === S.huidig ? "aan" : ""}" data-punt="${i}" title="${esc(p.titel)}${auto ? " (automatisch afgevinkt)" : ""}"><span class="ri">${statusIkoon(st)}</span><span class="rt">${esc(p.kort || p.titel)}</span>${vs === "ok" ? '<span class="rvs" title="Voorstel klaar"></span>' : vs === "nvt" ? '<span class="rvs nvt" title="Voorstel: n.v.t."></span>' : ""}</button>`;
    }
    h += `</div>`;
  }
  $("#rail").innerHTML = h;
  $("#railKnop").innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.1M4.5 12h.1M4.5 18h.1"/></svg><span>Alle punten</span><span class="vgmini"><i style="width:${pct}%"></i></span><span><b>${t.klaar}</b>/${t.totaal}</span>`;
  $(".rpunt.aan", $("#rail"))?.scrollIntoView({ block: "nearest" });
}

function rijenVoor(p, o) {
  const st = S.punten[p.id];
  const kand = (S.kand[p.id] || {})[o] || [];
  const ids = new Set(kand.map((k) => k.id));
  const extra = (st.gekozen[o] || []).filter((id) => !ids.has(id)).map((id) => ({ id, score: 0, hand: true }));
  return [...extra, ...kand];
}
function perObject(p) { return p.scope === "object" && S.type === "portefeuille"; }
function objLabel(o) { const x = S.objecten.find((y) => y.nr === o); return x ? `${x.adres || ""}${x.plaats ? ", " + x.plaats : ""}` : ""; }

function standaardFocus(p) {
  const st = S.punten[p.id];
  for (const o of objNrs(p)) { const g = st.gekozen[o] || []; if (g.length) return { o, id: g[0] }; }
  for (const o of objNrs(p)) { const r = rijenVoor(p, o); if (r.length) return { o, id: r[0].id }; }
  return { o: objNrs(p)[0], id: null };
}

function tekenPunt() {
  const p = PUNTEN[S.huidig], st = S.punten[p.id];
  if (p.paraaf === "taxateurs" && !st.status && !st.paraaf.initialen) { const ik = teamMet("taxateur").find((x) => zelfde(x.ini, S.dossier.ingevuldDoor)); if (ik) st.paraaf.initialen = ik.ini; }
  if (!S.focus || S.focus.pid !== p.id) S.focus = { pid: p.id, ...standaardFocus(p) };
  const s = sectieVan(p.sectie);
  const vs = voorstel(p);
  const gevonden = objNrs(p).reduce((n, o) => n + (st.gekozen[o] || []).length, 0);
  let vondst = "";
  if (p.paraaf) vondst = paraafStand(st);
  else if (p.auto === "padlengte") { const a = autoCheck(p, "_"); vondst = `<span class="st ${a.res === "ok" ? "klaar" : "mis"}">${esc(a.tekst)}</span>`; }
  else if (vs.soort === "nvt") vondst = `<span class="st nvt">Voorstel: n.v.t. · ${esc(vs.tekst)}</span>`;
  else if (gevonden) {
    const mappen = [...new Set(objNrs(p).flatMap((o) => bewijsVan(p.id, o)).map((b) => b.map))];
    vondst = `<span class="st klaar">${svgVink(10)} ${p.fotos ? meervoud(gevonden, "foto", "foto’s") : meervoud(gevonden, "bestand", "bestanden")} gevonden</span><span class="vondstmap">${mappen.slice(0, 2).map((m) => esc(m || "dossiermap")).join(" · ")}${mappen.length > 2 ? ` · +${mappen.length - 2}` : ""}</span>`;
    if (perObject(p)) { const zonder = S.objecten.filter((o) => !(st.gekozen[o.nr] || []).length && !st.objNvt[o.nr]); if (zonder.length) vondst += `<span class="st open">${zonder.length} van ${S.objecten.length} objecten zonder bestand</span>`; }
  } else vondst = `<span class="st open">Niets gevonden · kies zelf een bestand, of n.v.t. of ontbreekt</span>`;

  const pijl = (r) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${r ? "M9 5l7 7-7 7" : "M15 5l-7 7 7 7"}"/></svg>`;
  $("#puntKop").innerHTML = `
    <div class="pkboven">
      <div class="pkmeta"><span>${esc(sectieLabel(s))}</span><span>Punt ${S.huidig + 1} van ${PUNTEN.length}</span></div>
      <div class="pknav">
        <button class="ikoonknop" data-actie="vorige" title="Vorige punt (←)" aria-label="Vorige punt" ${S.huidig === 0 ? "disabled" : ""}>${pijl(false)}</button>
        <button class="ikoonknop" data-actie="volgende" title="Volgende punt (→)" aria-label="Volgende punt" ${S.huidig === PUNTEN.length - 1 ? "disabled" : ""}>${pijl(true)}</button>
      </div>
    </div>
    <div class="pkrij">
      <div class="pktekst">
        <h1>${esc(p.titel)}${p.rol ? ` <span class="rol">${esc(p.rol)}</span>` : ""}</h1>
        ${p.hint ? `<p class="punthint">${esc(p.hint)}</p>` : ""}
        ${p.voorwaarde ? `<div class="voorwaarde"><span>${esc(p.voorwaarde.label)}</span>${keuzes(p.voorwaarde.veld, p.voorwaarde.opties(), S.dossier[p.voorwaarde.veld])}</div>` : ""}
        <div class="vondst">${vondst}</div>
      </div>
      <div class="pkbeslis" id="beslis"></div>
    </div>`;
  tekenKand();
  tekenVoorbeeld();
  tekenBeslis();
}

function kandRij(p, o, k) {
  const b = B(k.id);
  if (!b) return "";
  const st = S.punten[p.id];
  const gekozen = (st.gekozen[o] || []).includes(b.id);
  const focus = S.focus && S.focus.id === b.id && S.focus.o === o;
  const badges = [];
  if (k.hand) badges.push('<span class="kb hand">zelf gekozen</span>');
  if (k.gedeeld) badges.push('<span class="kb">gedeeld</span>');
  if (b.sjabloon) badges.push('<span class="kb let">sjabloon?</span>');
  if (b.ro === true && /berekening|alleen/.test(p.id + p.sectie)) badges.push('<span class="kb">alleen-lezen</span>');
  if (!k.hand && k.score >= 7) badges.push('<span class="kb sterk">sterk</span>');
  return `<div class="kand ${gekozen ? "gekozen" : ""} ${focus ? "focus" : ""}" data-id="${esc(b.id)}" data-obj="${esc(o)}">
    <button class="kvink" data-actie="kies" aria-pressed="${gekozen}" title="${gekozen ? "Niet als bewijs gebruiken" : "Als bewijs gebruiken"}">${svgVink(11, 3)}</button>
    <button class="kinfo" data-actie="focus">${ftype(b)}<span class="ktekst"><span class="knaam">${esc(b.naam)}</span><span class="kpad">${esc(b.map || "dossiermap")}</span></span><span class="kmeta">${b.gewijzigd ? `<span>${esc(datumKort(b.gewijzigd))}</span>` : ""}${badges.join("")}</span></button>
  </div>`;
}
function fotoRijen(p, o) {
  const st = S.punten[p.id];
  const rijen = rijenVoor(p, o);
  const perMap = new Map();
  rijen.forEach((k) => { const b = B(k.id); if (!b) return; if (!perMap.has(b.map)) perMap.set(b.map, []); perMap.get(b.map).push(b); });
  return [...perMap].map(([map, bs]) => {
    const g = bs.filter((b) => (st.gekozen[o] || []).includes(b.id)).length;
    const focus = S.focus && S.focus.o === o && bs.some((b) => b.id === S.focus.id);
    return `<div class="kand map ${g ? "gekozen" : ""} ${focus ? "focus" : ""}" data-map="${esc(map)}" data-obj="${esc(o)}" data-id="${esc(bs[0].id)}">
      <button class="kvink" data-actie="kiesmap-alle" aria-pressed="${g > 0}" title="Alle foto’s in deze map">${svgVink(11, 3)}</button>
      <button class="kinfo" data-actie="focus"><span class="ft ft-ft">${bs.length}</span><span class="ktekst"><span class="knaam">${esc(map.split("\\").pop() || "dossiermap")}</span><span class="kpad">${esc(map)}</span></span><span class="kmeta"><span>${g === bs.length ? "alle" : g} gekozen</span></span></button>
    </div>`;
  }).join("");
}

function tekenKand() {
  const p = PUNTEN[S.huidig], st = S.punten[p.id];
  const vak = $("#kandPaneel");
  let lijf = "";
  if (p.paraaf) {
    lijf += `<div class="paraaf"><div class="vld"><label>Paraaf door <span class="optioneel">(initialen)</span></label>${personen("paraaf")}</div>
      <div class="vld"><label for="paraafDatum">Datum</label><input id="paraafDatum" class="invoer" value="${esc(st.paraaf.datum || datumNL(new Date()))}" autocomplete="off"></div></div>`;
  }
  if (p.auto === "padlengte") {
    const l = padLengtes();
    const max = Math.max(INSTELLINGEN.maxPad, l[0]?.lengte || 0);
    lijf += `<div class="padlijst"><div class="padkop">Langste paden${S.dossier.pad ? "" : " <em>(vanaf de dossiermap)</em>"}</div>${l.slice(0, 8).map((x) => `<button class="padrij ${x.lengte >= INSTELLINGEN.maxPad ? "te" : ""} ${S.focus.id === x.b.id ? "focus" : ""}" data-actie="focus" data-id="${esc(x.b.id)}" data-obj="_"><span class="padbalk"><i style="width:${(x.lengte / max) * 100}%"></i><s style="left:${(INSTELLINGEN.maxPad / max) * 100}%"></s></span><span class="padtekst"><b>${x.lengte}</b> ${esc(x.b.naam)}</span></button>`).join("")}</div>`;
  } else if (p.zoek) {
    for (const o of objNrs(p)) {
      const rijen = rijenVoor(p, o);
      const kop = perObject(p) ? (() => {
        const n = (st.gekozen[o] || []).length, nvt = st.objNvt[o];
        const a = p.auto ? autoCheck(p, o) : null;
        return `<div class="objkop ${nvt ? "nvt" : ""}"><div><b>${esc(o)}</b><span>${esc(objLabel(o))}</span></div><span class="objst ${nvt ? "nvt" : a ? (a.res === "ok" ? "ok" : a.res === "onbekend" ? "" : "mis") : n ? "ok" : "mis"}">${nvt ? "n.v.t." : a ? (a.res === "ok" ? "in orde" : a.res === "onbekend" ? "zelf nakijken" : "niet in orde") : n ? meervoud(n, p.fotos ? "foto" : "bestand", p.fotos ? "foto’s" : "bestanden") : "niets"}</span><button class="mini ${nvt ? "aan" : ""}" data-actie="objnvt" data-obj="${esc(o)}" aria-pressed="${!!nvt}">n.v.t.</button></div>`;
      })() : "";
      const auto = p.auto && !perObject(p) ? (() => { const a = autoCheck(p, o); return `<div class="autores ${a.res}">${a.res === "ok" ? svgVink(12) : svgLet(12)}<span>${esc(a.tekst)}</span></div>`; })() : "";
      const inhoud = rijen.length ? (p.fotos ? fotoRijen(p, o) : rijen.slice(0, 60).map((k) => kandRij(p, o, k)).join("")) : `<div class="kleeg">Niets gevonden${perObject(p) ? " voor dit object" : ""}.</div>`;
      lijf += `<div class="objgroep ${st.objNvt[o] ? "nvt" : ""}">${kop}${auto}${inhoud}</div>`;
    }
  }
  const n = objNrs(p).reduce((s, o) => s + rijenVoor(p, o).length, 0);
  vak.innerHTML = `<div class="paneelkop"><h2>${p.paraaf && !p.zoek ? "Paraaf" : p.auto === "padlengte" ? "Controle" : "Gevonden"}</h2>${p.zoek ? `<span class="aantal">${n || ""}</span>` : ""}<div class="rechtsin">${p.zoek || p.auto === "padlengte" ? `<button class="mini" data-actie="ander">+ Ander bestand</button>` : ""}</div></div><div class="kandlijst">${lijf}</div>`;
}

function tekenVoorbeeld() {
  const p = PUNTEN[S.huidig], st = S.punten[p.id];
  const kop = $("#vbKop"), lijf = $("#vbLijf");
  const f = S.focus;
  if (p.fotos) {
    const o = f?.o ?? objNrs(p)[0];
    const bs = bewijsVan(p.id, o);
    kop.innerHTML = `<span class="ft ft-ft">${bs.length}</span><b>Foto’s${perObject(p) ? " · " + esc(o) : ""}</b><span class="kruimel">${kruimels(bs[0]?.map || "")}</span>${bs.some((b) => b.demo) ? '<span class="rechtsin"><span class="st demo">nagemaakt voorbeeld</span></span>' : ""}`;
    toonFotos(lijf, bs.length ? bs : rijenVoor(p, o).map((k) => B(k.id)).filter(Boolean).slice(0, 30));
    return;
  }
  const b = f && f.id ? B(f.id) : null;
  if (!b) {
    kop.innerHTML = `<b>Voorbeeld</b>`;
    if (p.paraaf && !p.zoek) {

  if (id === "geel") h = `<rect x="0" y="0" width="60" height="18" fill="#FFDF00"/><rect x="6" y="6" width="26" height="3" rx="1" fill="#25273A"/><rect x="6" y="11" width="16" height="1.4" rx=".7" fill="#25273A" opacity=".55"/>${rijen(24, 10)}${vakken(24, 10)}`;
  if (id === "navy") h = `<rect x="0" y="0" width="60" height="18" fill="#25273A"/><rect x="0" y="18" width="60" height="1.4" fill="#FFDF00"/><rect x="6" y="6" width="26" height="3" rx="1" fill="#fff"/><rect x="6" y="11" width="16" height="1.4" rx=".7" fill="#FFDF00"/><rect x="6" y="23" width="48" height="3.6" fill="#25273A"/>${rijen(30, 9)}${vakken(30, 9)}`;
  if (id === "compact") h = `<rect x="6" y="6" width="1.2" height="6" fill="#FFDF00"/><rect x="8.5" y="6.5" width="18" height="2" rx=".8" fill="#25273A"/><rect x="6" y="13" width="48" height=".5" fill="#25273A"/>${Array.from({ length: 15 }, (_, i) => `<rect x="8" y="${16 + i * 3.4}" width="${30 + ((i * 7) % 12)}" height="1.1" rx=".5" fill="#D9D9DE"/><rect x="47.5" y="${15.6 + i * 3.4}" width="2.2" height="2.2" rx=".4" fill="${i === 5 ? "#C4C5CC" : "#25273A"}"/>`).join("")}`;
  return `<svg viewBox="0 0 60 80" aria-hidden="true"><rect x=".5" y=".5" width="59" height="79" rx="1.5" fill="#fff" stroke="#E3E3E8"/>${h}</svg>`;
}
function rTitel() {
  const d = S.dossier;
  if (S.type === "portefeuille") return esc(d.projectnaam || S.bron?.naam || "Portefeuille");
  const o = S.objecten[0] || {};
  return `${esc(d.dossiernummer || o.nr || "")}${o.adres ? ` · ${esc(o.adres)}${o.plaats ? ", " + esc(o.plaats) : ""}` : ""}`;
}
function rRegelTekst(p) {
  const st = S.punten[p.id];
  const delen = [];
  if (!st.status) return `<span class="ropen">nog niet nagelopen</span>`;
  if (st.status === "mist") delen.push(`<b class="rrood">${p.auto ? "Niet in orde" : "Ontbreekt"}</b>`);
  if (perObject(p)) {
    const ok = S.objecten.filter((o) => st.objRes[o.nr] === "ok").length;
    const nvt = S.objecten.filter((o) => st.objRes[o.nr] === "nvt").map((o) => o.nr);
    const mist = S.objecten.filter((o) => st.objRes[o.nr] === "mist").map((o) => o.nr);
    const n = S.objecten.length;
    if (st.status === "nvt") delen.push(`n.v.t. voor ${n === 2 ? "beide" : "alle"} objecten`);
    else if (st.status !== "mist") delen.push(`${ok} van ${n} objecten${nvt.length ? `, n.v.t. bij ${nvt.join(", ")}` : ""}${mist.length ? `; ontbreekt bij ${mist.join(", ")}` : ""}`);
  } else if (A4.bestandsnamen && !p.paraaf) {
    if (p.auto === "padlengte") delen.push(esc(autoCheck(p, "_").kort));
    else { const k = bewijsKort(p, objNrs(p)[0]); if (k && st.status !== "nvt") delen.push(`<span class="rbewijs">${esc(k)}</span>`); }
  }
  if (st.toelichting) delen.push(esc(st.toelichting));
  return delen.join(" · ");
}
function rTabel(punten, kolom2) {
  let h = `<table class="rtab"><colgroup><col style="width:47%"><col style="width:10%"><col style="width:7%"><col></colgroup><thead><tr><th>Onderdeel</th><th class="c">${kolom2}</th><th class="c">n.v.t.</th><th>Toelichting / locatie</th></tr></thead><tbody>`;
  let sectie = null;
  for (const p of punten) {
    if (p.sectie !== sectie) {
      sectie = p.sectie;
      const s = sectieVan(sectie);
      if (s.nr) h += `<tr class="rgroep"><td colspan="4">${esc(s.nr)}. ${esc(s.titel)}</td></tr>`;
    }
    const st = S.punten[p.id].status;
    h += `<tr><td>${esc(p.titel)}</td><td class="c">${vakje(st === "ok" || st === "deels", st === "deels" ? "let" : "")}</td><td class="c">${vakje(st === "nvt", "nvt")}</td><td class="rtoel">${rRegelTekst(p)}</td></tr>`;
  }
  return h + "</tbody></table>";
}
function rChecks() {
  const rij = (p) => {
    const st = S.punten[p.id];
    const ini = st.status === "ok" ? st.paraaf.initialen : "";
    return `<tr><td>${esc(p.titel)}</td><td>${esc(p.rol)}</td><td class="c">${A4.paraafvakken ? `<span class="rparaaf"></span>` : vakje(st.status === "ok")}</td><td class="c"><b>${esc(ini)}</b></td><td class="c">${esc(st.status === "ok" ? st.paraaf.datum : "")}</td></tr>`;
  };
  return `<table class="rtab"><colgroup><col style="width:40%"><col style="width:17%"><col style="width:17%"><col style="width:11%"><col></colgroup><thead><tr><th>Checks</th><th>Wie</th><th class="c">Paraaf</th><th class="c">Initialen</th><th class="c">Datum</th></tr></thead><tbody>${PUNTEN.filter((p) => p.sectie === "checks").map(rij).join("")}</tbody></table>`;
}
function rMeta() {
  const d = S.dossier;
  const paar = (l, w) => (w ? `<div><span>${l}</span><b>${esc(w)}</b></div>` : "");
  return `<div class="rmeta">
    ${paar("Jaar", d.jaar)}${paar("Opdrachtgever", d.opdrachtgever)}${paar("Projectnaam", d.projectnaam)}
    ${paar(S.type === "portefeuille" ? "Dossiernummers" : "Dossiernummer", d.dossiernummer)}${paar("Versie", d.versie)}${paar("FLOW ID", d.flowId)}
    ${paar("Type taxatie", d.typeTaxatie)}${paar("High risk", d.highRisk ? (d.highRisk === "ja" ? "Ja" : "Nee") : "")}${paar("Terugkerend", d.terugkerend)}
    ${paar("Taxateurs", (d.taxateurs || []).map(persoonTekst).join(", "))}${paar("Ingevuld door", persoonTekst(d.ingevuldDoor))}
    ${S.type === "portefeuille" ? paar("Niet meegenomen", S.objectenAlle.filter((o) => !o.mee).map((o) => o.nr).join(", ")) : ""}
  </div>`;
}
function rKop(vervolg = false) {
  const t = tellingen();
  const d = S.dossier;
  const sub = [d.opdrachtgever, d.typeTaxatie, S.type === "portefeuille" ? `portefeuille, ${meervoud(S.objecten.length, "object", "objecten")}` : "enkel object"].filter(Boolean).map(esc).join(" · ");
  if (vervolg) return `<div class="rkop vervolg"><i class="rgeel"></i><div class="rtekst"><div class="rklein">Checklist digitaal dossier · vervolg</div><h1>${rTitel()}</h1></div><div class="rr">${merkSvg("rlogo")}</div></div>`;
  return `<div class="rkop"><i class="rgeel"></i><div class="rtekst"><div class="rklein">Checklist digitaal dossier</div><h1>${rTitel()}</h1><div class="rsub">${sub}</div></div><div class="rr">${merkSvg("rlogo")}<span class="rdatum">${datumLang(new Date())}</span></div></div>
    <div class="rstand"><span class="rs"><b>${t.klaar}/${t.totaal}</b> nagelopen</span><span class="rs"><i class="rbol ok"></i><b>${t.ok}</b> aanwezig</span><span class="rs"><i class="rbol nvt"></i><b>${t.nvt}</b> n.v.t.</span><span class="rs"><i class="rbol mist"></i><b>${t.mist + t.deels}</b> ontbreekt${t.deels ? " of deels" : ""}</span>${t.open ? `<span class="rs ropen"><b>${t.open}</b> open</span>` : `<span class="rs rklaar">${svgVink(9, 3.4)} compleet nagelopen</span>`}</div>`;
}
function rObjectBijlage() {
  const items = PUNTEN.filter((p) => p.scope === "object");
  const teken = (st, o) => { const r = st.objRes[o]; return r === "ok" ? `<span class="rmk ok">${R_VINK}</span>` : r === "nvt" ? `<span class="rmk nvt">${R_STREEP}</span>` : r === "mist" ? `<span class="rmk mist">${R_KRUIS}</span>` : `<span class="rmk open"></span>`; };
  const delen = [];
  delen.push(`<div class="rlabel">Objecten</div><table class="rtab"><colgroup><col style="width:16%"><col style="width:58%"><col></colgroup><thead><tr><th>Dossier</th><th>Adres</th><th>Plaats</th></tr></thead><tbody>${S.objecten.map((o) => `<tr><td><b>${esc(o.nr)}${o.versie ? "-" + esc(o.versie) : ""}</b></td><td>${esc(o.adres || "—")}</td><td>${esc(o.plaats || "")}</td></tr>`).join("")}</tbody></table>`);
  for (let i = 0; i < S.objecten.length; i += 6) {
    const groep = S.objecten.slice(i, i + 6);
    let h = `<table class="rtab rmat"><colgroup><col style="width:${groep.length > 4 ? 40 : 46}%">${groep.map(() => "<col>").join("")}</colgroup><thead><tr><th>Per object${S.objecten.length > 6 ? ` (${i + 1}–${i + groep.length})` : ""}</th>${groep.map((o) => `<th class="c">${esc(o.nr)}</th>`).join("")}</tr></thead><tbody>`;
    let sectie = null;
    for (const p of items) {
      if (p.sectie !== sectie) { sectie = p.sectie; const s = sectieVan(sectie); h += `<tr class="rgroep"><td colspan="${groep.length + 1}">${esc(s.nr ? s.nr + ". " : "")}${esc(s.titel)}</td></tr>`; }
      const st = S.punten[p.id];
      h += `<tr><td>${esc(p.kort || p.titel)}</td>${groep.map((o) => `<td class="c">${teken(st, o.nr)}</td>`).join("")}</tr>`;
    }
    delen.push(h + "</tbody></table>");
  }
  delen.push(`<div class="rlegenda"><span><span class="rmk ok">${R_VINK}</span>aanwezig</span><span><span class="rmk nvt">${R_STREEP}</span>n.v.t.</span><span><span class="rmk mist">${R_KRUIS}</span>ontbreekt</span><span><span class="rmk open"></span>niet nagelopen</span></div>`);
  return delen;
}

function a4Blokken() {
  const naarEl = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return [...t.content.children]; };
  const uit = [];
  uit.push(...naarEl(rKop()));
  uit.push(...naarEl(rMeta()));
  uit.push(...naarEl(rTabel(PUNTEN.filter((p) => !["digitaal", "checks"].includes(p.sectie)), "Aanwezig")));
  uit.push(...naarEl(`<div class="rlabel">Digitaal dossier</div>`));
  uit.push(...naarEl(rTabel(PUNTEN.filter((p) => p.sectie === "digitaal"), "Objectdossier")));
  uit.push(...naarEl(rChecks()));
  if (S.type === "portefeuille" && A4.perObject) {
    uit.push({ nieuwBlad: true, titel: "Bijlage per object" });
    rObjectBijlage().forEach((h) => uit.push(...naarEl(h)));
  }
  return uit;
}

function nieuwBlad(stapel, eerste, titel = "") {
  const blad = document.createElement("div");
  blad.className = `a4 sj-${A4.sjabloon}`;
  blad.innerHTML = `<div class="a4in"></div><div class="a4voet"><span>Checklist Tool · ${esc(S.dossier.pad || S.bron?.root || S.bron?.naam || "")}</span><span class="pnr"></span></div>`;
  stapel.appendChild(blad);
  const binnen = $(".a4in", blad);
  if (!eerste) { const t = document.createElement("template"); t.innerHTML = rKop(true); binnen.append(...t.content.children); if (titel) { const l = document.createElement("div"); l.className = "rlabel eerst"; l.textContent = titel; binnen.appendChild(l); } }
  return binnen;
}
const overloopt = (el) => el.scrollHeight > el.clientHeight + 1;

function pagineer(stapel, blokken) {
  stapel.innerHTML = "";
  let binnen = nieuwBlad(stapel, true);
  for (const blok of blokken) {
    if (blok.nieuwBlad) { binnen = nieuwBlad(stapel, false, blok.titel); continue; }
    if (blok.tagName === "TABLE") {
      const maakTabel = () => { const t = blok.cloneNode(false); for (const c of blok.children) if (c.tagName !== "TBODY") t.appendChild(c.cloneNode(true)); const tb = document.createElement("tbody"); t.appendChild(tb); binnen.appendChild(t); return tb; };
      let tb = maakTabel();
      for (const rij of [...blok.tBodies[0].rows]) {
        tb.appendChild(rij);
        if (overloopt(binnen)) {
          tb.removeChild(rij);
          const mee = [];
          if (tb.lastElementChild && tb.lastElementChild.classList.contains("rgroep")) mee.push(tb.removeChild(tb.lastElementChild));
          if (!tb.rows.length) tb.parentElement.remove();
          binnen = nieuwBlad(stapel, false);
          tb = maakTabel();
          mee.forEach((m) => tb.appendChild(m));
          tb.appendChild(rij);
        }
      }
    } else {
      binnen.appendChild(blok);
      if (overloopt(binnen) && binnen.children.length > 1) {
        binnen.removeChild(blok);
        const vorige = binnen.lastElementChild;
        const meeLabel = vorige && vorige.classList.contains("rlabel") ? binnen.removeChild(vorige) : null;
        binnen = nieuwBlad(stapel, false);
        if (meeLabel) binnen.appendChild(meeLabel);
        binnen.appendChild(blok);
      }
    }
  }
  const bladen = $$(".a4", stapel);
  bladen.forEach((b, i) => ($(".pnr", b).textContent = `Pagina ${i + 1} van ${bladen.length}`));
  return bladen.length;
}

function bouwA4() {
  const stapel = $("#a4Stapel");
  if (!stapel || !S.bron) return;
  $("#a4Schaal").style.transform = "none";
  const n = pagineer(stapel, a4Blokken());
  $("#a4Info").innerHTML = `<b>${n} ${n === 1 ? "pagina" : "pagina’s"}</b> · A4 staand · ${esc(pdfNaam())}.pdf`;
  schaalA4();
}
function schaalA4() {
  const vak = $(".a4scroll"), schaal = $("#a4Schaal"), stapel = $("#a4Stapel");
  if (!vak || !stapel.firstElementChild) return;
  const breedte = stapel.firstElementChild.offsetWidth;
  const ruimte = vak.clientWidth - 32;
  const f = Math.min(1, ruimte / breedte);
  schaal.style.transform = `scale(${f})`;
  schaal.style.width = `${breedte}px`;
  schaal.style.height = `${stapel.offsetHeight * f}px`;
  schaal.style.marginLeft = `${Math.max(0, (vak.clientWidth - breedte * f) / 2)}px`;
}
function afdrukken() {
  if (MODUS === "artifact") {
    openVenster({ titel: "Afdrukken kan hier niet", tekst: "In deze online voorbeeldversie blokkeert de browser het afdrukken. In het HTML-bestand op de netwerkschijf werkt het wel: daar wordt dit blad met Afdrukken › Opslaan als pdf de checklist in het dossier.", knoppen: [{ tekst: "Begrepen", klasse: "vol" }] });
    return;
  }
  const pv = $("#printvak");
  pv.innerHTML = $("#a4Stapel").innerHTML;
  const oud = document.title;
  document.title = pdfNaam();
  const klaar = () => { pv.innerHTML = ""; document.title = oud; window.removeEventListener("afterprint", klaar); };
  window.addEventListener("afterprint", klaar);
  window.print();
}

/* =====================================================================
   Start: merk, sneltoetsen, en waar de tool opent.
   ===================================================================== */

function merkSvg(klasse = "") {
  if (MERK === "logo" && typeof LOGO_D !== "undefined") {
    return `<svg class="${klasse}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" aria-hidden="true"><rect fill="#FFE843" width="500" height="500"/><path fill="#C90C0F" d="${LOGO_D}"/></svg>`;
  }
  return `<svg class="${klasse}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" aria-hidden="true"><rect fill="#FFE843" width="500" height="500" rx="70"/><path d="M128 262l84 84 162-190" fill="none" stroke="#25273A" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function start() {
  $$("#stappen button").forEach((b) => (b.dataset.label = b.textContent.trim()));
  $(".vlag").innerHTML = merkSvg();
  try {
    let fav = document.querySelector('link[rel="icon"]');
    if (!fav) { fav = document.createElement("link"); fav.rel = "icon"; document.head.appendChild(fav); }
    fav.type = "image/svg+xml";
    fav.href = "data:image/svg+xml," + encodeURIComponent(merkSvg());
  } catch {}
  koppel();
  if (MODUS === "artifact") {
    $("#knopPrint").outerHTML = `<span class="st demo">Afdrukken werkt in het bestand op de netwerkschijf</span>`;
  } else {
    $("#knopPrint").addEventListener("click", afdrukken);
  }
  const h = location.hash.slice(1);
  if (MODUS === "artifact") {
    laadDemo("enkel", ["dossier", "controle", "overzicht", "a4"].includes(h) ? h : "controle");
  } else {
    toonScherm("dossier");
  }
}
document.addEventListener("DOMContentLoaded", start);

</script>
