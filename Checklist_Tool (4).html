<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<!--
=====================================================================
  TEAM  ·  initialen, rollen en namen
=====================================================================
  Uit deze lijst kies je in de tool bij Taxateurs, Checklist ingevuld
  door en de parafen.

  Aanpassen:
    1. Open dit bestand in Kladblok (rechtsklik › Openen met › Kladblok).
    2. Pas de regels aan tussen <script ...> en </script> hieronder.
    3. Sla op (Ctrl+S) en ververs de tool in de browser (F5).

  Eén regel per persoon:   Initialen | Rol | Naam
    Rol    taxateur, secretariaat, of allebei: taxateur, secretariaat.
           Een andere rol, zoals analist, komt alleen bij
           'Checklist ingevuld door'.
    Naam   mag leeg blijven: dan toont de tool alleen de initialen.
    #      Een regel die met # begint, slaat de tool over.

  Staat iemand er niet in? In de tool kun je altijd zelf een naam of
  initialen typen in het open veld naast de knoppen.
=====================================================================
-->
<script type="text/plain" id="team">
# Initialen | Rol           | Naam
MO          | taxateur      |
KV          | taxateur      |
GV          | taxateur      |
PK          | taxateur      |
KK          | taxateur      |
AT          | taxateur      |
WH          | taxateur      |
DK          | taxateur      |
DC          | secretariaat  |
JH          | secretariaat  |
IC          | secretariaat  |
SZ          | secretariaat  |
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist Tool</title>
<style>
/* =====================================================================
   Checklist Tool — opmaak
   Zelfde vormtaal als de Portefeuille Tool: navy en geel dragen, cream is
   het papier, grijs alleen getint.
   Layout: kop bovenaan; bij de controle links de puntenlijst, in het
   midden wat er gevonden is, rechts het voorbeeld, onderaan de beslisbalk.
   ===================================================================== */
:root{
  color-scheme:light;
  --navy:#25273A; --geel:#FFDF00; --cream:#EEE8E3;
  --navy2:#666874; --navy3:#92939C; --navy4:#BEBEC4; --navy5:#D3D4D8; --navy6:#E9E9EB;
  --inkt:#25273A; --zacht:#666874; --flauw:#92939C;
  --lijn:rgba(37,39,58,.11); --lijn-sterk:rgba(37,39,58,.20);
  --vlak:#F2F3F5; --papier:#EEE8E3; --wit:#FFFFFF;
  --accent:#25273A; --accent-zacht:rgba(37,39,58,.07);
  --goed:#2A7F45; --goed-t:#DAEEDF; --teal:#238291; --let:#B85300; --let-t:#FCE2CC; --signaal:#CE181E; --signaal-t:#FBE9E9;
  --geel-t:#FFF8CC;
  --r-klein:8px; --r:12px; --r-groot:16px; --r-pil:980px;
  --schaduw:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --schaduw-op:0 2px 6px rgba(0,0,0,.07),0 12px 32px rgba(0,0,0,.09);
  --soepel:200ms cubic-bezier(.22,.61,.36,1);
  --kophoogte:52px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--papier);color:var(--inkt);font-family:var(--sans);
  font-size:14px;line-height:1.47;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.verborgen{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.zacht{color:var(--flauw)}
.pad{padding:12px 16px}
.bn{font-variant-numeric:tabular-nums}
kbd{font:600 10.5px var(--mono);padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.07);color:inherit;opacity:.75;margin-left:2px}

/* ---------- knoppen ---------- */
.k{font-size:13.5px;font-weight:500;padding:7px 14px;border-radius:var(--r-klein);cursor:pointer;border:0;
  background:var(--accent-zacht);color:var(--accent);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:background var(--soepel),transform var(--soepel),opacity var(--soepel),filter var(--soepel),box-shadow var(--soepel)}
.k.vol{background:var(--accent);color:#fff}
.k.stil{background:rgba(0,0,0,.05);color:var(--zacht)}
.k.geel{background:var(--geel);color:#000;font-weight:600}
.k.waarschuw{background:rgba(206,24,30,.08);color:var(--signaal)}
.k:disabled{opacity:.4;cursor:not-allowed}
.k:hover:not(:disabled){filter:brightness(1.06)}
.k.stil:hover:not(:disabled){background:var(--navy6);color:var(--inkt);filter:none}
.k.vol:hover:not(:disabled){filter:brightness(1.18)}
.k:active:not(:disabled){transform:scale(.97)}
.k.cta{background:var(--geel);color:#000;font-weight:600;font-size:14px;padding:9px 18px;border-radius:11px;
  box-shadow:0 1px 2px rgba(37,39,58,.18),0 6px 18px rgba(37,39,58,.14)}
.k.cta:hover:not(:disabled){filter:none;background:#FFE733;box-shadow:0 1px 2px rgba(37,39,58,.2),0 8px 22px rgba(37,39,58,.18)}
.k.cta.rood{background:var(--signaal);color:#fff}
.k.cta.rood:hover:not(:disabled){background:#B5141A}
.k.cta kbd{background:rgba(0,0,0,.09)}
.k.cta.rood kbd{background:rgba(255,255,255,.2)}
.mini{font-size:11.5px;padding:3.5px 10px;border:0;border-radius:var(--r-pil);background:rgba(0,0,0,.05);color:var(--zacht);cursor:pointer;white-space:nowrap;transition:background var(--soepel),color var(--soepel)}
.mini:hover:not(:disabled){background:var(--accent-zacht);color:var(--accent)}
.mini.aan{background:var(--navy);color:#fff}
.ikoonknop{width:32px;height:32px;border:0;border-radius:var(--r-pil);background:transparent;color:var(--zacht);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background var(--soepel),color var(--soepel);flex:0 0 auto}
.ikoonknop:hover:not(:disabled){background:rgba(0,0,0,.06);color:var(--inkt)}
.ikoonknop:disabled{opacity:.3;cursor:not-allowed}
.segment{display:inline-flex;background:rgba(0,0,0,.05);border-radius:var(--r-pil);padding:2px;gap:2px}
.segment button{border:0;background:none;cursor:pointer;border-radius:var(--r-pil);padding:4px 12px;font-size:12.5px;font-weight:500;color:var(--zacht);white-space:nowrap;transition:background var(--soepel),color var(--soepel),box-shadow var(--soepel)}
.segment button.aan{background:var(--wit);color:var(--inkt);box-shadow:0 1px 3px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04)}
.seglabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--flauw);font-weight:600;margin-right:4px}
.keuzes{display:flex;flex-wrap:wrap;gap:6px}
.keuze{font-size:13px;padding:6px 13px;border-radius:var(--r-pil);border:1px solid var(--lijn);background:var(--wit);color:var(--inkt);cursor:pointer;white-space:nowrap;transition:background var(--soepel),border-color var(--soepel),color var(--soepel)}
.keuze:hover{background:var(--vlak)}
.keuze.aan{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:500}
/* personen: initialen met naam, eigen namen met een kruisje, en een open veld */
.keuze.persoon,.keuze.los{display:inline-flex;align-items:baseline;gap:6px}
.keuze.persoon b,.keuze.los b{font-weight:600}
.keuze.persoon span,.keuze.los span{font-size:12px;color:var(--zacht);font-weight:400}
.keuze.persoon.aan span,.keuze.los span{color:rgba(255,255,255,.75)}
.keuze.los i{font-style:normal;font-size:15px;line-height:1;margin-left:1px;opacity:.7;align-self:center}
.keuze.los:hover i{opacity:1}
.vld .personen input.anders{flex:0 1 200px;width:auto;min-width:140px;font-size:13px;padding:6px 13px;border-radius:var(--r-pil);background:var(--wit);box-shadow:inset 0 0 0 1px var(--lijn)}
.vld .personen input.anders:focus{box-shadow:0 0 0 3px var(--accent-zacht),inset 0 0 0 1px var(--accent)}
.vld .personen input.anders.gevuld{background:var(--navy);color:#fff;box-shadow:none;font-weight:500}
.vld .personen input.anders.gevuld:focus{box-shadow:0 0 0 3px var(--accent-zacht)}

/* ---------- status ---------- */
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:var(--r-pil);white-space:nowrap;background:var(--vlak);color:var(--zacht)}
.st.klaar,.st.s-ok{background:var(--goed-t);color:var(--goed)}
.st.open{background:var(--let-t);color:var(--let)}
.st.mis,.st.s-mist{background:var(--signaal-t);color:var(--signaal)}
.st.s-deels{background:var(--let-t);color:var(--let)}
.st.nvt,.st.s-nvt{background:var(--navy6);color:var(--zacht)}
.st.s-open{background:transparent;color:var(--flauw);box-shadow:inset 0 0 0 1px var(--lijn)}
.st.demo{background:var(--geel-t);color:#6B5600;font-size:10.5px;padding:2px 8px;letter-spacing:.02em}

/* ---------- kop ---------- */
.kop{background:rgba(255,255,255,.74);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--lijn);position:sticky;top:0;z-index:40;height:var(--kophoogte);flex:0 0 auto}
@supports not (backdrop-filter:blur(1px)){.kop{background:#fff}}
.kopbinnen{height:100%;max-width:1600px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:14px}
.merk{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--inkt);cursor:pointer;letter-spacing:-.015em;flex:0 0 auto;border:0;background:none;padding:4px 6px 4px 0;font-size:14.5px}
.vlag{width:24px;height:24px;display:block;flex:0 0 auto}
.vlag svg{width:100%;height:100%;display:block;border-radius:3px}
.stappen{display:inline-flex;gap:2px;background:rgba(0,0,0,.05);border-radius:var(--r-pil);padding:2px;flex:0 1 auto;overflow-x:auto;scrollbar-width:none}
.stappen::-webkit-scrollbar{display:none}
.stappen button{border:0;background:none;cursor:pointer;border-radius:var(--r-pil);padding:4px 12px;font-size:12.5px;font-weight:500;color:var(--zacht);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background var(--soepel),color var(--soepel),box-shadow var(--soepel)}
.stappen button:hover:not(:disabled){color:var(--inkt)}
.stappen button.aan{background:var(--wit);color:var(--inkt);box-shadow:0 1px 3px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04)}
.stappen button:disabled{opacity:.4;cursor:not-allowed}
.stapvink{width:15px;height:15px;border-radius:50%;background:var(--goed);color:#fff;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.kopcontext{min-width:0;flex:1 1 auto;font-size:13px;color:var(--zacht);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopcontext b{color:var(--inkt);font-weight:600}
.kop .rechts{margin-left:auto;display:flex;gap:2px;align-items:center;flex:0 0 auto}
.stand{font-size:12px;color:var(--zacht);margin-right:8px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- schermen ---------- */
.scherm{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:auto}
.blad{width:100%;max-width:1240px;margin:0 auto;padding:22px 18px 28px;flex:1 0 auto;display:flex;flex-direction:column;gap:14px}
.paneel{background:var(--wit);border-radius:var(--r-groot);box-shadow:var(--schaduw)}
.paneelkop{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.paneelkop h2{margin:0;font-size:14px;font-weight:600}
.paneelkop .aantal{font-size:12px;color:var(--flauw)}
.paneelkop .rechtsin{margin-left:auto;display:flex;gap:6px;align-items:center}
.voetbalk{position:sticky;bottom:0;z-index:20;background:rgba(238,232,227,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:.5px solid var(--lijn);flex:0 0 auto}
.voetbinnen{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px}
.voetbinnen .samen{font-size:12.5px;color:var(--zacht)}
.voetbinnen .samen b{color:var(--inkt)}
.voetbinnen .rest{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- 1 · dossier ---------- */
.dataintro,.ovkop{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.dataintro h1,.ovkop h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.022em}
.dataintro p,.ovkop p{margin:3px 0 0;color:var(--zacht);font-size:13px;max-width:68ch}
.dataintro .rechtsin,.ovkop .rechtsin{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.datavak{background:var(--wit);border-radius:var(--r-groot);box-shadow:var(--schaduw);padding:16px;transition:box-shadow var(--soepel)}
.vakdrop{border:1.5px dashed var(--navy4);background:#FBFAF8;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:34px 24px;text-align:center;min-height:250px;cursor:pointer;outline:0;transition:border-color var(--soepel),background var(--soepel)}
.vakdrop:hover{border-color:var(--navy3);background:#F7F5F1}
.vakdrop:focus-visible{box-shadow:0 0 0 3px var(--accent-zacht),0 0 0 1px var(--accent)}
.vdtekst b{display:block;font-size:18px;font-weight:600;letter-spacing:-.018em}
.vdtekst .sub{display:block;font-size:13px;color:var(--zacht);max-width:480px;line-height:1.5;margin-top:3px}
.vakdrop .knoppen{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pijlop{width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--geel);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(37,39,58,.28)}
.datavak.doel{box-shadow:0 0 0 2px var(--geel),var(--schaduw)}
.datavak.doel .vakdrop{border:2px solid var(--navy);background:var(--geel-t)}
.datavak.klein{padding:10px}
.datavak.klein .vakdrop{min-height:0;flex-direction:row;padding:12px 16px;text-align:left;justify-content:flex-start}
.datavak.klein .pijlop{width:36px;height:36px;box-shadow:none}
.datavak.klein .pijlop svg{width:17px;height:17px}
.datavak.klein .vdtekst b{font-size:14px}
.datavak.klein .vdtekst .sub{font-size:12px}
.datavak.klein .knoppen{margin-left:auto}
.vakhints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.vakhint{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.6)}
.vakhint .ti{width:30px;height:30px;border-radius:8px;background:var(--wit);display:flex;align-items:center;justify-content:center;color:var(--zacht);flex:0 0 auto;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.vakhint b{display:block;font-size:13px}
.vakhint span{font-size:12px;color:var(--zacht);line-height:1.45}
.bron{padding:14px 16px}
.bronkop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bronikoon{width:40px;height:40px;border-radius:11px;background:var(--geel);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brontekst{min-width:0;flex:1 1 240px}
.brontekst h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.brontekst p{margin:1px 0 0;font-size:12.5px;color:var(--zacht);word-break:break-all}
.bronkop .rechtsin{display:flex;align-items:center;gap:6px;margin-left:auto}
.bronfeiten{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:.5px solid var(--lijn)}
.bronfeiten b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.bronfeiten b small{font-size:12px;color:var(--flauw);font-weight:500}
.bronfeiten span{font-size:11.5px;color:var(--flauw)}
.schakel{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding-top:12px;border-top:.5px solid var(--lijn);cursor:pointer}
.schakel input{position:absolute;opacity:0;width:1px;height:1px}
.schakel .sk{width:38px;height:23px;border-radius:12px;background:var(--navy5);position:relative;flex:0 0 auto;transition:background var(--soepel);margin-top:1px}
.schakel .sk::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform var(--soepel)}
.schakel input:checked+.sk{background:var(--goed)}
.schakel input:checked+.sk::after{transform:translateX(15px)}
.schakel input:focus-visible+.sk{outline:2px solid var(--accent);outline-offset:2px}
.sktekst b{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.sktekst>span{display:block;font-size:12px;color:var(--zacht);margin-top:2px;max-width:80ch}
.gegevens{padding-bottom:6px}
.vldraster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 18px;padding:14px 16px 4px}
.vld{margin-bottom:14px;min-width:0}
.vld.breed{grid-column:1/-1}
.vld>label{display:block;font-size:12px;font-weight:500;color:var(--zacht);margin-bottom:6px}
.optioneel{font-weight:400;color:var(--flauw)}
.invoer,.vld input{width:100%;font-size:13.5px;padding:8px 11px;border:0;border-radius:var(--r-klein);background:var(--vlak);color:var(--inkt);transition:box-shadow var(--soepel),background var(--soepel)}
.invoer:focus,.vld input:focus{outline:0;background:var(--wit);box-shadow:0 0 0 3px var(--accent-zacht),0 0 0 1px var(--accent)}
.vld input[readonly]{color:var(--zacht)}
.invoer::placeholder,.vld input::placeholder{color:var(--navy4)}
.hint{font-size:11.5px;color:var(--flauw);line-height:1.45;margin-top:5px}
details.uitklap{margin-top:6px}
details.uitklap summary{cursor:pointer;font-size:12px;color:var(--zacht);list-style:none;display:inline-flex;align-items:center;gap:5px}
details.uitklap summary::-webkit-details-marker{display:none}
details.uitklap summary::before{content:"›";font-size:14px;line-height:1;color:var(--flauw);transition:transform var(--soepel)}
details.uitklap[open] summary::before{transform:rotate(90deg)}
.hrlijst{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--zacht)}
.tabelscroll{overflow:auto;max-height:340px;margin-top:10px}
.datatabel{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
.datatabel th{position:sticky;top:0;background:#FAFAFB;text-align:left;font-weight:600;color:var(--zacht);font-size:11.5px;padding:8px 14px;border-bottom:1px solid var(--lijn);white-space:nowrap}
.datatabel td{padding:7px 14px;border-bottom:.5px solid var(--lijn)}
.datatabel tr:last-child td{border-bottom:0}

/* beginscherm: eerst het soort dossier */
.startkop h1{margin:6px 0 0;font-size:26px;font-weight:600;letter-spacing:-.025em}
.startkop p{margin:6px 0 0;color:var(--zacht);font-size:14px;max-width:64ch}
.keuzetegels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ktegel{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:22px 22px 20px;border-radius:18px;border:0;cursor:pointer;
  background:var(--wit);color:var(--inkt);box-shadow:var(--schaduw),inset 0 0 0 1.5px transparent;transition:box-shadow var(--soepel),transform var(--soepel)}
.ktegel:hover{transform:translateY(-1px);box-shadow:var(--schaduw-op),inset 0 0 0 1.5px var(--geel)}
.ktegel:active{transform:scale(.99)}
.kticoon{width:64px;height:64px;border-radius:16px;background:var(--geel);color:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.ktegel b{font-size:19px;font-weight:600;letter-spacing:-.02em}
.ktuitleg{font-size:13.5px;color:var(--zacht);line-height:1.5}
.ktvoet{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--zacht);margin-top:6px;padding-top:10px;border-top:.5px solid var(--lijn);width:100%}
.ktvoet svg{color:var(--goed);flex:0 0 auto}
.startanders{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.startanders span{font-size:13px;color:var(--flauw);margin-right:4px}
.keuzelabel{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--flauw);font-weight:600;margin-bottom:3px}
.linkje{border:0;background:none;padding:0;font:inherit;letter-spacing:0;text-transform:none;color:var(--zacht);text-decoration:underline;text-decoration-color:var(--navy4);text-underline-offset:2px;cursor:pointer}
.linkje:hover{color:var(--inkt)}

/* ---------- 2 · controle ---------- */

.rpunt .rt{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.werk{display:flex;flex-direction:column;min-width:0;min-height:0}
.puntkop{padding:12px 22px 12px}

.pknav{margin-left:auto;display:flex;gap:2px}
.pkrij{display:flex;gap:28px;align-items:flex-start}

.pkbeslis{flex:0 0 384px;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.bkgroep{display:grid;grid-template-columns:1fr 1.15fr 1.45fr;gap:6px}
.bk{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 10px;border-radius:11px;border:0;cursor:pointer;
  font-size:13.5px;font-weight:600;white-space:nowrap;background:var(--wit);color:var(--inkt);box-shadow:inset 0 0 0 1px var(--lijn-sterk);
  transition:background var(--soepel),box-shadow var(--soepel),color var(--soepel),transform var(--soepel)}

.bk-nvt.gekozen{background:var(--navy3)}

.rol{font-size:13px;font-weight:500;color:var(--zacht);letter-spacing:0;background:var(--vlak);padding:2px 9px;border-radius:var(--r-pil);vertical-align:3px}
.besluit{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--zacht);padding:0 2px}

.besluit.s-ok .ri{background:var(--goed)}.besluit.s-mist .ri{background:var(--signaal)}.besluit.s-nvt .ri{background:var(--navy4)}.besluit.s-deels .ri{background:#E07B00}

.objkop span{font-size:11.5px;color:var(--flauw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.objst{font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--r-pil);background:var(--vlak);color:var(--zacht)!important;flex:0 0 auto}
.objst.ok{background:var(--goed-t);color:var(--goed)!important}.objst.mis{background:var(--let-t);color:var(--let)!important}

.kb{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:var(--r-pil);background:var(--vlak);color:var(--zacht)}
.kb.sterk{background:var(--goed-t);color:var(--goed)}.kb.let{background:var(--let-t);color:var(--let)}.kb.hand{background:var(--geel-t);color:#6B5600}

.ft{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:22px;padding:0 5px;border-radius:5px;font:700 9.5px var(--sans);letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--navy3);flex:0 0 auto}
.ft-pdf{background:#C9302C}.ft-mail{background:#0F6CBD}.ft-xl{background:#107C41}.ft-wd{background:#2B579A}.ft-pp{background:#C43E1C}.ft-ft{background:var(--teal)}.ft-zp{background:var(--navy2)}.ft-tp{background:var(--navy4)}

.padlijst{padding:2px 4px}

.pkop b{display:block;font-size:18px;font-weight:700}
.pkop span{display:block;font-size:12px;color:#666874;margin-top:2px}
.pregels{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.pregels i{display:block;height:7px;border-radius:2px;background:#E7E7EA}
.ptab{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.ptab th{text-align:left;border-bottom:1px solid #25273A;padding:5px 6px;font-size:11px}
.ptab td{padding:5px 6px;border-bottom:.5px solid #E5E5EA}
.ptekst{line-height:1.55;margin:10px 0}
.plabel{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px}
.phand{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:44px}
.phand>div{border-top:1px solid #92939C;padding-top:4px;position:relative}
.phand .krabbel{position:absolute;bottom:22px;left:8px;width:110px;height:34px}
.phand span{font-size:11px;color:#666874;display:block;margin-top:2px}
.pnoot{font-size:12px;color:#B85300}
.pmail{display:grid;grid-template-columns:60px 1fr;gap:3px 8px;font-size:11.5px;background:#F5F2F0;padding:8px 10px;margin-top:12px}
.pmail span{color:#92939C}
.pkaart{width:100%;height:auto;display:block;margin:6px 0 10px;border:.5px solid #E5E5EA}
.pleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#666874}
.pleg i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.plabels{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.plabels div{color:#fff;font-weight:700;font-size:11.5px;padding:3px 8px;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%)}
.plabels div.raak{outline:2px solid #25273A;outline-offset:1px}
.pomslag{display:flex;gap:14px;margin:-6px 0 22px}
.pomslag i{width:6px;background:#FFDF00;flex:0 0 auto}
.pomslag span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#92939C;font-weight:700}
.pomslag b{display:block;font-size:22px;font-weight:400;line-height:1.2;margin:3px 0}
.pomslag em{font-style:normal;font-size:12px;color:#666874}
.pwater{position:absolute;top:44%;left:-10%;right:-10%;text-align:center;transform:rotate(-24deg);font-size:64px;font-weight:700;color:rgba(206,24,30,.09);letter-spacing:.1em;pointer-events:none}
.popm{position:absolute;right:16px;top:180px;width:170px;background:#FFF1A8;border-radius:3px;padding:8px 10px;font-size:11px;line-height:1.45;box-shadow:0 2px 6px rgba(0,0,0,.15);transform:rotate(1.5deg)}

.toel .invoer.schud{animation:schud .4s}
@keyframes schud{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* railknop (smal scherm) */
.railknop{display:none}
.railsluit{display:none}

/* ---------- 3 · overzicht ---------- */
.tegels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tegel{background:var(--wit);border-radius:14px;box-shadow:var(--schaduw);padding:13px 16px;min-width:0;position:relative}
.tegel .tl{font-size:12px;color:var(--zacht);font-weight:500}
.tegel .tw{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.2;margin:5px 0 6px;font-variant-numeric:tabular-nums}
.tegel .tw small{font-size:13px;font-weight:500;color:var(--zacht);letter-spacing:0}
.tegel .ts{font-size:11.5px;color:var(--flauw);display:flex;gap:5px;align-items:center}
.tegel.hoofd::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--geel)}
.checkpunten{padding:10px 16px 14px;display:flex;flex-direction:column;gap:6px}
.cpunt{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;background:#FFF1E4;border-radius:10px;padding:9px 12px}
.cpunt.mis{background:var(--signaal-t)}
.cpunt .dci{width:16px;height:16px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;margin-top:1px;font-size:10px;font-weight:700;background:#E07B00;color:#fff}
.cpunt.mis .dci{background:var(--signaal)}
.cpunt .detail{display:block;color:var(--zacht);margin-top:2px;font-size:12px;overflow-wrap:anywhere}
.ovtabel{overflow:auto}
.lijsttab{width:100%;border-collapse:collapse;font-size:12.5px}
.lijsttab th{text-align:left;font-size:11.5px;color:var(--zacht);font-weight:600;padding:12px 14px 8px;border-bottom:1px solid var(--lijn)}
.lijsttab td{padding:7px 14px;border-bottom:.5px solid var(--lijn);vertical-align:top}
.lijsttab tr.gkop td{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--flauw);font-weight:600;padding-top:16px;background:#FCFBF9}
.lijsttab .bewijs{max-width:360px;overflow-wrap:anywhere}
.olink{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--inkt);font-weight:500}
.olink:hover{text-decoration:underline;text-decoration-color:var(--navy4);text-underline-offset:2px}
.obst{display:inline-block;font-size:10.5px;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:5px;margin:0 3px 3px 0;background:var(--vlak);color:var(--zacht)}
.obst.s-ok{background:var(--goed-t);color:var(--goed)}.obst.s-mist{background:var(--signaal-t);color:var(--signaal)}.obst.s-nvt{background:var(--navy6)}.obst.s-voor{box-shadow:inset 0 0 0 1px #A7D3B6}

/* ---------- 4 · A4 ---------- */
.studio{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr)}
.stkeuzes{overflow:auto;padding:20px 20px 16px;border-right:.5px solid var(--lijn);background:#FCFCFC}
.stkop h2{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.stkop p{margin:0 0 6px;font-size:12.5px;color:var(--zacht);line-height:1.5}
.stgroep{padding:14px 0;border-top:.5px solid var(--lijn);margin-top:10px;display:flex;flex-direction:column;gap:4px}
.stlabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--flauw);font-weight:600;margin-bottom:4px}
.sttekst{font-size:12.5px;color:var(--zacht);margin:0 0 8px;overflow-wrap:anywhere}
.sjraster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sjkaart{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;cursor:pointer;background:var(--wit);border-radius:12px;padding:8px 9px 10px;
  box-shadow:inset 0 0 0 1px var(--lijn);transition:box-shadow var(--soepel),background var(--soepel)}
.sjkaart:hover{box-shadow:inset 0 0 0 1px var(--lijn-sterk)}
.sjkaart.aan{background:#FFFBE6;box-shadow:inset 0 0 0 2px var(--navy)}
.sjbeeld{display:block;width:100%;border-radius:7px;background:#F4F2EF;padding:7px 0;margin-bottom:5px}
.sjbeeld svg{display:block;height:84px;margin:0 auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.08))}
.sjkaart b{font-size:13px;font-weight:600}
.sjkaart>span:last-child{font-size:11.5px;color:var(--flauw);line-height:1.35}
.vink{display:flex;gap:11px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer}
.vink:hover{background:var(--vlak)}
.vink input{margin-top:3px;accent-color:var(--navy);width:16px;height:16px}
.vink b{display:block;font-size:13.5px;font-weight:600}
.vink span span{font-size:12px;color:var(--flauw)}
.stvoorbeeld{display:flex;flex-direction:column;min-width:0;min-height:0;background:#E7E2DD}
.stbalk{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.7);border-bottom:.5px solid var(--lijn);font-size:12.5px;color:var(--zacht);flex-wrap:wrap}
.stbalk b{color:var(--inkt)}
.stbalk .rest{margin-left:auto;display:flex;gap:8px}
.a4scroll{flex:1 1 auto;overflow:auto;padding:16px 0 30px}
.a4schaal{transform-origin:top left}

/* het blad zelf: maten in mm, zodat scherm en papier gelijk zijn */
.a4{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:12mm 13mm 0;
  font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;color:#25273A;font-size:10.5px;line-height:1.3;-webkit-print-color-adjust:exact;print-color-adjust:exact;margin:0 auto 14px;box-shadow:0 2px 14px rgba(0,0,0,.10)}
.a4in{height:calc(297mm - 12mm - 11mm);overflow:hidden;flex:0 0 auto}
.a4voet{height:11mm;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:8.5px;color:#7A7C87;border-top:.2mm solid #DCDCE1;flex:0 0 auto}
.a4voet span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rkop{display:flex;gap:10px;align-items:flex-start;margin-bottom:2.5mm;padding-bottom:2.5mm;border-bottom:.4mm solid #25273A}
.rgeel{width:5px;align-self:stretch;background:#FFDF00;flex:0 0 auto}
.rtekst{flex:1;min-width:0}
.rklein{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;color:#92939C;font-weight:700}
.a4 h1{margin:1px 0 0;font-size:19px;letter-spacing:-.01em;line-height:1.15;font-weight:400}
.rsub{color:#666874;margin-top:2px;font-size:10px}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}
.rlogo{width:12mm;height:12mm;display:block}
.rdatum{font-size:9px;color:#92939C;white-space:nowrap}
.rkop.vervolg{margin-bottom:4mm;padding-bottom:2.5mm}
.rkop.vervolg h1{font-size:14px}
.rkop.vervolg .rlogo{width:8mm;height:8mm}
.rstand{display:flex;flex-wrap:wrap;gap:2mm 6mm;font-size:9.5px;color:#666874;margin:0 0 3mm;align-items:center}
.rstand b{color:#25273A}
.rbol{display:inline-block;width:2.2mm;height:2.2mm;border-radius:50%;margin-right:1.3mm;vertical-align:-.25mm}
.rbol.ok{background:#25273A}.rbol.nvt{background:#C4C5CC}.rbol.mist{background:#CE181E}
.rklaar{color:#25273A;font-weight:700;display:inline-flex;align-items:center;gap:1mm}
.rs b{font-weight:700;color:#25273A}
.ropen{color:#92939C;font-style:italic}
.rmeta{display:flex;flex-wrap:wrap;gap:1.2mm 6mm;margin:0 0 2.5mm;padding:1.8mm 3.2mm;background:#F5F2F0}
.rmeta span{display:block;font-size:8px;color:#7A7C87}
.rmeta b{font-weight:700;font-size:9.5px}
.rlabel{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;color:#25273A;font-weight:700;margin:2.5mm 0 1mm}
.rlabel.eerst{margin-top:0}
.rtab{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:1.5mm;font-size:10px}
.rtab th{text-align:left;font-weight:700;padding:.9mm 1.4mm;border-bottom:.3mm solid #25273A;font-size:9px;vertical-align:bottom}
.rtab td{padding:.5mm 1.4mm;border-bottom:.2mm solid #DCDCE1;vertical-align:middle;overflow:hidden;height:5.1mm}
.rtab .c{text-align:center}
.rtab tr.rgroep td{font-weight:700;padding-top:1.3mm;border-bottom:.2mm solid #B5B6BE;font-size:9.5px}
.rtab td.c{padding-left:0;padding-right:0}
.rtoel{color:#5E606B;font-size:9px;white-space:nowrap;text-overflow:ellipsis}
.rbewijs{color:#25273A}
.rrood{color:#CE181E}
.rvak{display:block;width:3.6mm;height:3.6mm;margin:0 auto;border:.25mm solid #8A8C96;border-radius:.7mm;box-sizing:border-box;position:relative}
.rvak svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rvak.aan{background:#25273A;border-color:#25273A}
.rvak.aan.nvt{background:#C4C5CC;border-color:#C4C5CC}
.rvak.aan.let{background:#E07B00;border-color:#E07B00}
.rparaaf{display:block;width:22mm;height:5mm;margin:0 auto;border-bottom:.25mm solid #8A8C96}
.rnoot{font-size:8.5px;color:#7A7C87;margin:0 0 1.5mm;line-height:1.35}
.rmat td,.rmat th{text-align:left}
.rmat .c{text-align:center}
.rmk{display:block;width:4.2mm;height:4.2mm;margin:0 auto;border-radius:50%;position:relative;box-sizing:border-box}
.rmk svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rmk.ok{background:#25273A}.rmk.mist{background:#CE181E}.rmk.nvt{background:#C4C5CC}
.rmk.open{border:.25mm solid #C4C5CC}
.rlegenda{display:flex;gap:6mm;flex-wrap:wrap;font-size:8.5px;color:#5E606B;margin-top:2mm;align-items:center}
.rlegenda>span{display:inline-flex;align-items:center;gap:1.5mm}
.rlegenda .rmk{display:inline-block;width:3.4mm;height:3.4mm;margin:0}

/* ---------- ontwerpen voor het blad ---------- */
/* Formulier: zoals de Excel-checklist, met vakken en rasterlijnen */
.a4.sj-formulier .rgeel{display:none}
.a4.sj-formulier .rkop{border:.3mm solid #25273A;padding:3mm 4mm;margin-bottom:0}
.a4.sj-formulier .rstand{border:.3mm solid #25273A;border-top:0;padding:1.6mm 4mm;margin:0}
.a4.sj-formulier .rmeta{background:none;border:.3mm solid #25273A;border-top:0;padding:0;gap:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:3mm}
.a4.sj-formulier .rmeta>div{padding:1.2mm 2.4mm;border-right:.2mm solid #C4C5CC;border-bottom:.2mm solid #C4C5CC}
.a4.sj-formulier .rtab{border:.3mm solid #25273A}
.a4.sj-formulier .rtab th{background:#EEE8E3;border-bottom:.3mm solid #25273A}
.a4.sj-formulier .rtab td,.a4.sj-formulier .rtab th{border-right:.2mm solid #C4C5CC}
.a4.sj-formulier .rtab tr.rgroep td{background:#F7F4F1;border-bottom:.2mm solid #C4C5CC}
.a4.sj-formulier .rlabel{margin-top:3mm}
/* Modern: grote cijfers, veel wit */
.a4.sj-modern .rgeel{display:none}
.a4.sj-modern .rkop{border-bottom:0;padding-bottom:0;margin-bottom:4mm}
.a4.sj-modern h1{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:1mm}
.a4.sj-modern .rklein{color:#B38F00}
.a4.sj-modern .rstand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2.5mm;margin-bottom:4mm}
.a4.sj-modern .rs{background:#F4F4F6;border-radius:2mm;padding:2.2mm 3mm;font-size:8.5px;color:#666874;display:flex;flex-direction:column;gap:.6mm;align-items:flex-start}
.a4.sj-modern .rs b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.a4.sj-modern .rs .rbol{display:none}
.a4.sj-modern .rs.rklaar{background:#25273A;color:#fff;justify-content:center;font-size:9px}
.a4.sj-modern .rs.rklaar svg{display:none}
.a4.sj-modern .rmeta{background:none;padding:0 0 3mm;border-bottom:.2mm solid #E3E3E8;border-radius:0}
.a4.sj-modern .rtab th{border-bottom:.2mm solid #DCDCE1;color:#7A7C87;font-weight:600;text-transform:uppercase;font-size:7.5px;letter-spacing:.06em}
.a4.sj-modern .rtab td{border-bottom:0}
.a4.sj-modern .rtab tbody tr:not(.rgroep):nth-child(even) td{background:#F8F8FA}
.a4.sj-modern .rtab tr.rgroep td{border-bottom:0;padding-top:2.6mm;font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:#7A7C87}
.a4.sj-modern .rvak{border-radius:50%}
.a4.sj-modern .rlabel{color:#7A7C87}
/* Geel en navy: een kopbalk over de hele breedte */
.a4.sj-geel .rgeel,.a4.sj-navy .rgeel{display:none}
.a4.sj-geel .a4in,.a4.sj-navy .a4in{overflow:visible}
.a4.sj-geel .rkop,.a4.sj-navy .rkop{margin:-12mm -13mm 4mm;padding:9mm 13mm 6mm;border-bottom:0;align-items:center}
.a4.sj-geel .rkop{background:#FFDF00}
.a4.sj-geel .rklein,.a4.sj-geel .rsub,.a4.sj-geel .rdatum{color:#25273A}
.a4.sj-geel h1,.a4.sj-navy h1{font-size:22px;font-weight:700}
.a4.sj-geel .rtab th{border-bottom:.4mm solid #25273A}
.a4.sj-geel .rtab tr.rgroep td{border-bottom:.3mm solid #FFDF00}
.a4.sj-navy .rkop{background:#25273A;color:#fff;border-bottom:1.2mm solid #FFDF00}
.a4.sj-navy .rklein{color:#FFDF00}
.a4.sj-navy .rsub,.a4.sj-navy .rdatum{color:#D3D4D8}
.a4.sj-navy .rtab th{background:#25273A;color:#fff;border-bottom:0}
.a4.sj-navy .rtab tr.rgroep td{border-bottom:.3mm solid #FFDF00}
.a4.sj-geel .rkop.vervolg,.a4.sj-navy .rkop.vervolg{padding:6mm 13mm 4mm}
/* Compact: kleiner en dichter op elkaar */
.a4.sj-compact{padding:9mm 10mm 0;font-size:9.5px}
.a4.sj-compact .a4in{height:calc(297mm - 9mm - 9mm)}
.a4.sj-compact .a4voet{height:9mm}
.a4.sj-compact h1{font-size:15px}
.a4.sj-compact .rkop{margin-bottom:1.8mm;padding-bottom:1.8mm}
.a4.sj-compact .rmeta{padding:1.4mm 2.6mm;margin-bottom:2mm}
.a4.sj-compact .rtab{font-size:9px}
.a4.sj-compact .rtab td{height:4.3mm;padding:.25mm 1.2mm}
.a4.sj-compact .rtab tr.rgroep td{padding-top:.9mm;font-size:8.8px}
.a4.sj-compact .rtoel{font-size:8.4px;white-space:normal}
.a4.sj-compact .rvak{width:3.1mm;height:3.1mm}
.a4.sj-compact .rmk{width:3.6mm;height:3.6mm}

/* ---------- vensters, melding, bezig ---------- */
.venster{position:fixed;inset:0;background:rgba(37,39,58,.30);z-index:90;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.vdoos{background:var(--wit);border-radius:20px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--schaduw-op);overflow:hidden;animation:popin 160ms cubic-bezier(.22,.61,.36,1) both}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.vdoos.smal{width:min(460px,100%)}
.vdoos.breed{width:min(760px,100%)}
.vkop{padding:20px 24px 4px}
.vkop h2{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.vkop p{margin:0;font-size:13px;color:var(--zacht);line-height:1.5}
.vlijf{padding:14px 24px;overflow:auto;flex:1}
.vvoet{display:flex;gap:9px;align-items:center;padding:13px 24px;border-top:.5px solid var(--lijn)}
.vvoet .rest{margin-left:auto;display:flex;gap:9px}
.zoekvak{margin-bottom:10px}
.zlijst{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow:auto}
.zrij{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:7px 8px;border-radius:9px;cursor:pointer}
.zrij:hover,.zrij:focus-visible{background:var(--vlak)}
.plak{width:100%;font:12px/1.5 var(--mono);resize:vertical}
.uitleg ol{margin:0 0 14px;padding-left:20px;font-size:13.5px;line-height:1.55}
.uitleg li{margin-bottom:6px}
.sneltoets{border-collapse:collapse;font-size:13px;margin-bottom:12px}
.sneltoets td{padding:5px 14px 5px 0;border-bottom:.5px solid var(--lijn)}
.sneltoets kbd{opacity:1}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:120;background:var(--navy);color:#fff;font-size:13px;padding:9px 16px;border-radius:var(--r-pil);box-shadow:var(--schaduw-op);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);animation:popin .18s ease both}
.toast.goed{background:#1F5F34}.toast.mis{background:#9C1217}
.bezig{position:fixed;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;padding:20px;cursor:progress;background:rgba(37,39,58,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:bzin .15s ease both}
@keyframes bzin{from{opacity:0}to{opacity:1}}
.bzdoos{background:var(--wit);border-radius:18px;width:min(460px,100%);padding:20px 22px 14px;box-shadow:var(--schaduw-op);cursor:default}
.bzkop{display:flex;gap:14px;align-items:flex-start}
.bzdraai{width:26px;height:26px;border-radius:50%;border:3px solid var(--navy6);border-top-color:var(--navy);flex:0 0 auto;margin-top:1px;animation:draai .8s linear infinite}
.bzt{min-width:0;flex:1}
.bztitel{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.bztekst{display:block;font-size:12.5px;color:var(--zacht);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.45em;direction:ltr}

.bzbalk i{display:block;height:100%;width:0;border-radius:99px;background:var(--navy);transition:width .25s ease}
.bzbalk.onbepaald i{width:32%;transition:none;animation:bzschuif 1.15s ease-in-out infinite}
@keyframes bzschuif{from{transform:translateX(-105%)}to{transform:translateX(320%)}}
.bzvoet{display:flex;align-items:center;gap:12px;min-height:30px}
.bznoot{font-size:12px;color:var(--flauw);flex:1;min-width:0;font-variant-numeric:tabular-nums}
.bzstop{margin-left:auto;flex:0 0 auto}
@keyframes draai{to{transform:rotate(360deg)}}
#printvak{display:none}

@media (max-width:1100px){
  .pkrij{flex-direction:column;gap:12px}
  .pkbeslis{flex-basis:auto;width:100%;max-width:520px}
  .controle{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:var(--kophoogte);bottom:0;left:0;width:min(300px,86vw);z-index:60;background:#FBFAF8;box-shadow:var(--schaduw-op);transform:translateX(-105%);transition:transform .25s ease}
  body.railopen .rail{transform:none}
  body.railopen .railsluit{display:block;position:fixed;inset:var(--kophoogte) 0 0 0;z-index:55;background:rgba(37,39,58,.25);border:0}
  .railknop{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--wit);box-shadow:var(--schaduw);border-radius:var(--r-pil);padding:5px 12px 5px 8px;font-size:12.5px;cursor:pointer;color:var(--zacht);margin:12px 22px 0;align-self:flex-start}

/* ---------------- team ----------------
   De mensen staan bovenaan in het HTML-bestand, in het blok TEAM, zodat
   iedereen ze in Kladblok kan aanpassen. Per regel: Initialen | Rol | Naam.
   Is dat blok weg of leeg, dan gelden de initialen uit INSTELLINGEN. */
const zelfde = (a, b) => String(a ?? "").trim().toLowerCase() === String(b ?? "").trim().toLowerCase();
function leesTeam() {
  let tekst = "";
  try { tekst = document.getElementById("team")?.textContent || ""; } catch {}
  const uit = [];
  for (const regel of tekst.split(/\r?\n/)) {
    const r = regel.trim();
    if (!r || r.startsWith("#") || !r.includes("|")) continue;
    const [ini = "", rol = "", ...rest] = r.split("|").map((x) => x.trim());
    const initialen = ini.replace(/\s+/g, "");
    if (!initialen || uit.some((p) => zelfde(p.ini, initialen))) continue;
    const rollen = rol.toLowerCase().split(/[,;/&+]|\s+en\s+/).map((x) => x.trim()).filter(Boolean)
      .map((x) => (/^tax/.test(x) ? "taxateur" : /^secr/.test(x) ? "secretariaat" : x));
    uit.push({ ini: initialen, rollen, naam: rest.join(" ").replace(/\s+/g, " ").trim() });
  }
  if (uit.length) return uit;
  return [
    ...INSTELLINGEN.taxateurs.map((ini) => ({ ini, rollen: ["taxateur"], naam: "" })),
    ...INSTELLINGEN.secretariaat.map((ini) => ({ ini, rollen: ["secretariaat"], naam: "" })),
  ];
}
const TEAM = leesTeam();

const teamLid = (w) => TEAM.find((p) => zelfde(p.ini, w));
/* Wat er getypt is: initialen of naam van iemand uit het team wordt die persoon;
   initialen in kleine letters worden hoofdletters; de rest blijft zoals getypt. */
function normPersoon(tekst) {
  const t = String(tekst ?? "").replace(/\s+/g, " ").trim();
  if (!t) return "";
  const p = TEAM.find((x) => zelfde(x.ini, t) || (x.naam && zelfde(x.naam, t)));
  if (p) return p.ini;
  return /^[a-z]{1,4}$/.test(t) ? t.toUpperCase() : t;
}
/* Voor op het blad: naam met initialen als de naam bekend is. */
function persoonTekst(w) {

}

/* =====================================================================
   Lezers voor het voorbeeld: zip (xlsx, docx, pptx, zip), Outlook .msg
   (OLE/CFB), .eml. Alles in de browser, zonder bibliotheken. Ze lezen
   alleen wat nodig is: van een rekenmodel van 5 MB alleen de lijst met
   tabbladen en de eerste regels.
   ===================================================================== */

/* ---------------- zip ---------------- */
const Zip = {
  kan: typeof DecompressionStream !== "undefined",
  async open(blob) {
    const grootte = blob.size;
    const staartLen = Math.min(grootte, 65557);
    const staart = new Uint8Array(await blob.slice(grootte - staartLen).arrayBuffer());
    let eocd = -1;
    for (let i = staart.length - 22; i >= 0; i--) {
      if (staart[i] === 0x50 && staart[i + 1] === 0x4b && staart[i + 2] === 0x05 && staart[i + 3] === 0x06) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("Geen zip-bestand");
    const dv = new DataView(staart.buffer, staart.byteOffset, staart.byteLength);
    const aantal = dv.getUint16(eocd + 10, true);
    const cdGrootte = dv.getUint32(eocd + 12, true);
    const cdStart = dv.getUint32(eocd + 16, true);
    if (cdStart === 0xffffffff) throw new Error("Zip64 wordt niet ondersteund");
    const cd = new Uint8Array(await blob.slice(cdStart, cdStart + cdGrootte).arrayBuffer());
    const cdv = new DataView(cd.buffer, cd.byteOffset, cd.byteLength);
    const items = new Map();
    const dec = new TextDecoder("utf-8");
    let p = 0;
    for (let i = 0; i < aantal && p + 46 <= cd.length; i++) {
      if (cdv.getUint32(p, true) !== 0x02014b50) break;
      const methode = cdv.getUint16(p + 10, true);
      const csize = cdv.getUint32(p + 20, true);
      const usize = cdv.getUint32(p + 24, true);
      const nlen = cdv.getUint16(p + 28, true);
      const xlen = cdv.getUint16(p + 30, true);
      const clen = cdv.getUint16(p + 32, true);
      const off = cdv.getUint32(p + 42, true);
      const naam = dec.decode(cd.subarray(p + 46, p + 46 + nlen));
      items.set(naam, { naam, methode, csize, usize, off });
      p += 46 + nlen + xlen + clen;
    }
    return new ZipBestand(blob, items);
  },
};

class ZipBestand {
  constructor(blob, items) { this.blob = blob; this.items = items; }
  namen() { return [...this.items.keys()]; }
  zoek(naam) {
    if (this.items.has(naam)) return this.items.get(naam);
    const l = naam.toLowerCase();
    for (const [k, v] of this.items) if (k.toLowerCase() === l) return v;
    return null;
  }
  async stroom(naam) {
    const e = typeof naam === "string" ? this.zoek(naam) : naam;
    if (!e) return null;
    const kop = new DataView(await this.blob.slice(e.off, e.off + 30).arrayBuffer());
    if (kop.getUint32(0, true) !== 0x04034b50) throw new Error("Beschadigde zip");
    const start = e.off + 30 + kop.getUint16(26, true) + kop.getUint16(28, true);
    const data = this.blob.slice(start, start + e.csize);
    if (e.methode === 0) return data.stream();
    if (e.methode === 8) {
      if (!Zip.kan) throw new Error("Deze browser kan geen zip uitpakken");
      return data.stream().pipeThrough(new DecompressionStream("deflate-raw"));
    }
    throw new Error("Onbekende zip-compressie (" + e.methode + ")");
  }
  /* Tekst lezen, en stoppen zodra er genoeg is (max tekens of stop()). */
  async tekst(naam, { max = Infinity, stop = null } = {}) {
    const s = await this.stroom(naam);
    if (!s) return null;
    const lezer = s.pipeThrough(new TextDecoderStream("utf-8")).getReader();
    let uit = "";
    for (;;) {
      const { value, done } = await lezer.read();
      if (done) break;
      uit += value;
      if (uit.length >= max || (stop && stop(value, uit))) { lezer.cancel().catch(() => {}); break; }
    }
    return uit;
  }
}

/* ---------------- xml-hulp ---------------- */
function xmlOntsnap(s) {
  return String(s)
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(parseInt(d, 10)))
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&");
}
function attr(tag, naam) {
  const m = new RegExp("\\s" + naam.replace(":", "\\:") + "=\"([^\"]*)\"").exec(tag);
  return m ? xmlOntsnap(m[1]) : null;
}

/* ---------------- Excel ---------------- */
const Xlsx = {
  async open(blob) {
    const z = await Zip.open(blob);
    const wb = await z.tekst("xl/workbook.xml");
    if (!wb) throw new Error("Geen werkmap gevonden");
    const rels = (await z.tekst("xl/_rels/workbook.xml.rels")) || "";
    const doelen = {};
    for (const m of rels.matchAll(/<Relationship\b[^>]*>/g)) {
      const id = attr(m[0], "Id"), doel = attr(m[0], "Target");
      if (id && doel) doelen[id] = doel.startsWith("/") ? doel.slice(1) : "xl/" + doel.replace(/^\.\//, "");
    }
    const bladen = [];
    for (const m of wb.matchAll(/<sheet\b[^>]*\/?>/g)) {
      const t = m[0];
      bladen.push({ naam: attr(t, "name") || "Blad", verborgen: /hidden/i.test(attr(t, "state") || ""), pad: doelen[attr(t, "r:id")] || null });
    }
    return new XlsxWerkmap(z, bladen);
  },
};

class XlsxWerkmap {
  constructor(z, bladen) { this.z = z; this.bladen = bladen; this._ss = null; }
  async gedeeld() {
    if (this._ss) return this._ss;
    const t = (await this.z.tekst("xl/sharedStrings.xml", { max: 6e6 })) || "";
    const uit = [];
    for (const m of t.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)) {
      let s = "";
      for (const n of m[1].matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)) s += n[1];
      uit.push(xmlOntsnap(s));
    }
    this._ss = uit;
    return uit;
  }
  async rijen(index, maxRijen = 30, maxKol = 14) {
    const blad = this.bladen[index];
    if (!blad || !blad.pad) return [];
    let geteld = 0;
    const xml = await this.z.tekst(blad.pad, {
      max: 8e6,
      stop: (stuk) => { geteld += (stuk.match(/<\/row>/g) || []).length; return geteld >= maxRijen; },
    });
    if (!xml) return [];
    const ss = /t="s"/.test(xml) ? await this.gedeeld() : [];
    const rijen = [];
    for (const r of xml.matchAll(/<row\b([^>]*)>([\s\S]*?)<\/row>/g)) {
      const rnr = parseInt(attr(r[0], "r") || rijen.length + 1, 10);
      const cellen = [];
      for (const c of r[2].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
        const kop = c[1], binnen = c[2] || "";
        const ref = (/\br="([A-Z]+)\d+"/.exec(kop) || [])[1];
        const kol = ref ? [...ref].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1 : cellen.length;
        if (kol >= maxKol) continue;
        const t = (/\bt="([a-zA-Z]+)"/.exec(kop) || [])[1] || "n";
        const v = (/<v>([\s\S]*?)<\/v>/.exec(binnen) || [])[1];
        let w = "";
        if (t === "s") w = ss[parseInt(v, 10)] ?? "";
        else if (t === "inlineStr") w = xmlOntsnap([...binnen.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map((x) => x[1]).join(""));
        else if (t === "b") w = v === "1" ? "WAAR" : "ONWAAR";
        else if (t === "str" || t === "e") w = xmlOntsnap(v || "");
        else if (v != null && v !== "") {
          const g = Number(v);
          w = Number.isFinite(g) ? g.toLocaleString("nl-NL", { maximumFractionDigits: Math.abs(g) < 10 ? 4 : 2 }) : v;
        }
        cellen[kol] = w;
      }
      rijen.push({ nr: rnr, cellen });
      if (rijen.length >= maxRijen) break;
    }
    return rijen;
  }
}

/* ---------------- Word en PowerPoint ---------------- */
async function leesDocx(blob, max = 160) {
  const z = await Zip.open(blob);
  const xml = await z.tekst("word/document.xml", { max: 4e6 });
  if (!xml) return [];
  const uit = [];
  for (const p of xml.split(/<\/w:p>/)) {
    let s = "";
    for (const m of p.matchAll(/<w:t\b[^>]*>([\s\S]*?)<\/w:t>|<w:tab\/>|<w:br\/>/g)) s += m[1] != null ? m[1] : m[0].startsWith("<w:tab") ? "\t" : "\n";
    s = xmlOntsnap(s).replace(/\s+$/g, "");
    if (s.trim()) uit.push(s);
    if (uit.length >= max) break;
  }
  return uit;
}
async function leesPptx(blob, max = 30) {
  const z = await Zip.open(blob);
  const dia = z.namen().filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a, b) => parseInt(a.match(/\d+/)[0], 10) - parseInt(b.match(/\d+/)[0], 10)).slice(0, max);
  const uit = [];
  for (const n of dia) {
    const xml = await z.tekst(n, { max: 1e6 });
    const regels = [];
    for (const p of xml.split(/<\/a:p>/)) {
      const s = xmlOntsnap([...p.matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map((m) => m[1]).join("")).trim();
      if (s) regels.push(s);
    }
    uit.push(regels);
  }
  return uit;
}

/* ---------------- OLE/CFB (Outlook .msg) ---------------- */
const EINDE = 0xfffffffe, VRIJ = 0xffffffff;

function leesCfb(buf) {
  const b = new Uint8Array(buf);
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const sig = [0xd0, 0xcf, 0x11, 0xe0, 0xa1, 0xb1, 0x1a, 0xe1];
  if (!sig.every((x, i) => b[i] === x)) throw new Error("Geen Outlook-bestand (.msg)");
  const sShift = dv.getUint16(0x1e, true), sGrootte = 1 << sShift;
  const mShift = dv.getUint16(0x20, true), mGrootte = 1 << mShift;
  const nFat = dv.getUint32(0x2c, true);
  const dirStart = dv.getUint32(0x30, true);
  const miniGrens = dv.getUint32(0x38, true);
  const miniFatStart = dv.getUint32(0x3c, true);
  const nMiniFat = dv.getUint32(0x40, true);
  let difat = dv.getUint32(0x44, true);
  const sOff = (s) => (s + 1) * sGrootte;

  const fatSectoren = [];
  for (let i = 0; i < 109 && fatSectoren.length < nFat; i++) {
    const v = dv.getUint32(0x4c + i * 4, true);
    if (v === VRIJ) break;
    fatSectoren.push(v);
  }
  let wacht = 0;
  while (difat !== EINDE && difat !== VRIJ && fatSectoren.length < nFat && wacht++ < 50000) {
    const o = sOff(difat);
    if (o + sGrootte > b.length) break;
    for (let i = 0; i < sGrootte / 4 - 1 && fatSectoren.length < nFat; i++) fatSectoren.push(dv.getUint32(o + i * 4, true));
    difat = dv.getUint32(o + sGrootte - 4, true);
  }
  const perSector = sGrootte / 4;
  const fat = new Uint32Array(fatSectoren.length * perSector);
  fatSectoren.forEach((s, k) => {
    const o = sOff(s);
    for (let i = 0; i < perSector; i++) fat[k * perSector + i] = o + i * 4 + 4 <= b.length ? dv.getUint32(o + i * 4, true) : EINDE;
  });
  const keten = (start) => {
    const uit = [];
    let s = start, g = 0;
    while (s < 0xfffffffa && s < fat.length && g++ <= fat.length) { uit.push(s); s = fat[s]; }
    return uit;
  };
  const leesKeten = (start, grootte) => {
    const sec = keten(start);
    const uit = new Uint8Array(sec.length * sGrootte);
    sec.forEach((s, i) => { const o = sOff(s); uit.set(b.subarray(o, Math.min(o + sGrootte, b.length)), i * sGrootte); });
    return grootte != null ? uit.subarray(0, Math.min(grootte, uit.length)) : uit;
  };

  const dir = leesKeten(dirStart);
  const ddv = new DataView(dir.buffer, dir.byteOffset, dir.byteLength);
  const items = [];
  for (let o = 0; o + 128 <= dir.length; o += 128) {
    const nlen = ddv.getUint16(o + 64, true);
    let naam = "";
    for (let i = 0; i < Math.max(0, Math.min(nlen, 64) - 2); i += 2) naam += String.fromCharCode(ddv.getUint16(o + i, true));
    items.push({
      naam, soort: dir[o + 66],
      links: ddv.getUint32(o + 68, true), rechts: ddv.getUint32(o + 72, true), kind: ddv.getUint32(o + 76, true),

function maakBestand({ pad, grootte = null, gewijzigd = null, ro = null, file = null, handle = null, entry = null, demo = false }) {

function leesPlaklijst(tekst) {

  if (!regels.length) throw new Error("Geen paden gevonden. Plak één pad per regel, bijvoorbeeld via ‘Als pad kopiëren’.");
  const delen = regels.map((r) => r.split(/[\\/]/));
  let n = 0;
  while (delen.every((d) => d.length > n + 1 && d[n] === delen[0][n])) n++;
  const root = delen[0].slice(0, n).join("\\");
  return { root, lijst: delen.map((d) => maakBestand({ pad: d.slice(n).join("\\") })) };

const STOP = { aan: false };

async function leesMap(root, melden) {

    laatst = t;
    melden({ deel, pad, kop, bestanden: uit.length, mappen });

  const top = await mapInhoud(root);
  const topMappen = top.filter((x) => x.map).sort((x, y) => x.naam.localeCompare(y.naam));
  top.filter((x) => !x.map).forEach((x) => bestand(x.naam, x.h));
  for (let i = 0; i < topMappen.length; i++) {
    const t = topMappen[i];
    const kop = `map ${i + 1} van ${topMappen.length}`;
    let ontdekt = 1, verwerkt = 0, hoogste = 0;
    const loop = async (d, pad) => {
      if (STOP.aan) throw new Error("gestopt");
      mappen++;
      const inhoud = await mapInhoud(d);
      ontdekt += inhoud.filter((x) => x.map).length;
      for (const x of inhoud) if (!x.map) bestand(`${pad}\\${x.naam}`, x.h);
      verwerkt++;
      hoogste = Math.max(hoogste, verwerkt / ontdekt);
      meld((i + hoogste) / topMappen.length, pad, kop);
      for (const x of inhoud) if (x.map) await loop(x.h, `${pad}\\${x.naam}`);
    };

/* ---------------- zoeken per punt ---------------- */
const TOON = 2.5, KIES = 4;
function scoreDetail(b, z) {

  S.bestanden.forEach((b) => (b.obj = objectVan(b)));

  const d = S.dossier;
  const info = padInfo(S.bron?.root);
  const fact = uitFactuur();
  const zet = (k, v) => { if (!d[k] && v) d[k] = v; };
  zet("pad", S.bron?.root || "");
  zet("jaar", info.jaar || String(new Date().getFullYear()));
  zet("opdrachtgever", info.opdrachtgever || fact?.opdrachtgever || "");
  if (S.type === "portefeuille") {
    zet("projectnaam", (info.laatste && !/^\d{5}/.test(info.laatste) ? info.laatste : "") || fact?.project || S.bron?.naam || "");
    d.dossiernummer = S.objecten.length ? `${S.objecten.map((o) => o.nr).join(", ")}` : d.dossiernummer;
  } else {
    zet("dossiernummer", S.objecten[0]?.nr || "");
    zet("projectnaam", fact?.project || "");
  }
  const versies = [...new Set(S.objecten.map((o) => o.versie).filter(Boolean))];
  zet("versie", versies.join(", "));

  S.kand = {};
  for (const p of PUNTEN) S.kand[p.id] = berekenKandidaten(p);
  for (const p of PUNTEN) {
    const oud = behoud ? S.punten[p.id] : null;
    const st = oud || nieuwPunt();
    for (const o of objNrs(p)) {
      if (!oud || !st.gekozen[o]) st.gekozen[o] = (S.kand[p.id][o] || []).filter((k) => k.score >= KIES && !k.gedeeld).map((k) => k.id);
    }
    S.punten[p.id] = st;
  }
}

/* ---------------- automatische controles ---------------- */
function padLengtes() {
  const basis = S.dossier.pad ? S.dossier.pad.replace(/[\\/]+$/, "").length + 1 : 0;
  return S.bestanden.filter((b) => !b.systeem).map((b) => ({ b, lengte: basis + b.id.length })).sort((a, c) => c.lengte - a.lengte);
}
function autoCheck(p, o) {
  const st = S.punten[p.id];
  if (p.auto === "padlengte") {
    const l = padLengtes();
    const te = l.filter((x) => x.lengte >= INSTELLINGEN.maxPad);
    const max = l[0]?.lengte || 0;
    const volledig = !!S.dossier.pad;
    if (te.length) return { res: "mist", tekst: `${meervoud(te.length, "pad is", "paden zijn")} ${INSTELLINGEN.maxPad} tekens of langer (langste ${max})`, kort: `${te.length}× ${INSTELLINGEN.maxPad}+ tekens, langste ${max}`, lijst: te.slice(0, 8) };
    return { res: "ok", tekst: volledig ? `Langste pad ${max} tekens, alles onder de ${INSTELLINGEN.maxPad}` : `Langste pad ${max} tekens vanaf de dossiermap. Plak het pad van de map bij Dossier voor de volledige lengte.`, kort: `Langste pad ${max} tekens${volledig ? "" : " (vanaf de dossiermap)"}`, lijst: l.slice(0, 5), deels: !volledig, zeker: volledig || max < INSTELLINGEN.maxPad - 60 };
  }
  const ids = (st.gekozen[o] || []);
  const bs = ids.map(B).filter(Boolean);
  if (p.auto === "alleenlezen") {
    if (!bs.length) return { res: "mist", tekst: "Geen berekening gevonden" };
    const nee = bs.filter((b) => b.ro === false), weet = bs.filter((b) => b.ro == null);
    if (nee.length) return { res: "mist", tekst: `Niet alleen-lezen: ${nee.map((b) => b.naam).join(", ")}` };
    if (weet.length) return { res: "onbekend", tekst: "De browser ziet niet of het bestand alleen-lezen is. Controleer het in Verkenner: rechtsklik › Eigenschappen." };
    return { res: "ok", tekst: `${bs.map((b) => b.naam).join(", ")} ${bs.length === 1 ? "staat" : "staan"} op alleen-lezen`, zeker: true };
  }
  if (p.auto === "bestandsnaam") {
    if (!bs.length) return { res: "mist", tekst: "Geen definitief rapport gevonden" };
    const nr = o === "_" ? S.objecten[0]?.nr : o;
    const goed = bs.filter((b) => new RegExp(`${nr}[-_ ]\\d{2}`).test(b.naam) && /definitief|final/i.test(b.naam));
    if (goed.length) return { res: "ok", tekst: `${goed[0].naam}: dossiernummer, versie en ${/final/i.test(goed[0].naam) ? "FINAL" : "DEFINITIEF"} staan in de naam`, zeker: true };
    return { res: "mist", tekst: `De naam mist dossiernummer-versie of DEFINITIEF/FINAL: ${bs[0].naam}` };
  }
  return null;
}

/* Wat de tool voorstelt, vóór jij beslist. */
function voorstel(p) {
  const d = S.dossier;
  const nvt = p.nvtAls ? p.nvtAls(d) : null;
  if (p.paraaf) {
    const st = S.punten[p.id];
    return { soort: st.paraaf.initialen ? "ok" : null, tekst: st.paraaf.initialen ? `Paraaf ${st.paraaf.initialen}` : "Kies je initialen" };
  }
  const objs = objNrs(p);
  let ok = 0, mist = 0, onbekend = 0;
  for (const o of objs) {
    const a = p.auto ? autoCheck(p, o) : null;
    const n = (S.punten[p.id].gekozen[o] || []).length;
    if (a) { if (a.res === "ok") ok++; else if (a.res === "onbekend") onbekend++; else mist++; }
    else if (n) ok++; else mist++;
  }
  if (nvt && !ok) return { soort: "nvt", tekst: nvt };
  if (ok === objs.length) return { soort: "ok", tekst: null };
  if (onbekend && !mist) return { soort: "onbekend", tekst: null };
  if (ok) return { soort: "deels", tekst: null };
  return { soort: "mist", tekst: null };
}

/* ---------------- beslissen ---------------- */
function samenvatting(res) {
  const w = Object.values(res);
  if (!w.length) return null;
  if (w.every((x) => x === "nvt")) return "nvt";
  if (w.every((x) => x === "ok" || x === "nvt")) return "ok";
  if (w.some((x) => x === "ok")) return "deels";
  return "mist";
}
function beslis(pid, status, { auto = false } = {}) {
  const p = PUNT[pid], st = S.punten[pid];
  if (status === "ok" && p.paraaf && !st.paraaf.initialen) return { fout: "Kies eerst de initialen voor de paraaf.", veld: "paraaf" };
  const objs = objNrs(p);
  if (status === "ok" && !p.paraaf && !p.auto) {
    const iets = objs.some((o) => (st.gekozen[o] || []).length || st.objNvt[o]);
    if (!iets) return { fout: "Er is nog geen bestand gekozen. Kies er een, of zet het punt op n.v.t. of ontbreekt.", veld: "bestand" };
  }
  st.objRes = {};
  for (const o of objs) {
    if (status !== "ok") { st.objRes[o] = status; continue; }
    if (st.objNvt[o]) { st.objRes[o] = "nvt"; continue; }
    if (p.auto) { const a = autoCheck(p, o); st.objRes[o] = a.res === "mist" ? "mist" : "ok"; continue; }
    if (p.paraaf) { st.objRes[o] = "ok"; continue; }
    st.objRes[o] = (st.gekozen[o] || []).length ? "ok" : "mist";
  }
  st.status = samenvatting(st.objRes);
  if (p.paraaf && status === "ok" && !st.paraaf.datum) st.paraaf.datum = datumNL(new Date());
  st.tijd = new Date().toISOString();
  st.auto = auto;
  return { ok: true };
}
function herzie(pid) { const st = S.punten[pid]; st.status = null; st.objRes = {}; st.tijd = null; st.auto = false; if (st.autoToel) { st.toelichting = ""; st.autoToel = false; } }

/* ---------------- automatisch afvinken ---------------- */
/* Alleen als het zeker is: naam én map kloppen voor elk object, geen sjabloon,
   en nooit bij punten waar je echt moet kijken (ondertekening, tabblad) of een paraaf. */
function zekerheid(p) {
  if (p.paraaf || p.nooitAuto) return null;
  const vs = voorstel(p);
  if (vs.soort === "nvt") return { soort: "nvt", tekst: vs.tekst };
  const st = S.punten[p.id];
  for (const o of objNrs(p)) {
    if (p.auto) { const a = autoCheck(p, o); if (!a || a.res !== "ok" || !a.zeker) return null; continue; }
    const g = st.gekozen[o] || [];
    if (!g.length || g.some((id) => B(id)?.sjabloon)) return null;
    if (!((S.kand[p.id] || {})[o] || []).some((k) => k.zeker && g.includes(k.id))) return null;
  }
  return { soort: "ok" };
}
function autoAfvinken() {
  let n = 0;
  for (const p of PUNTEN) {
    const st = S.punten[p.id];
    if (st.status && !st.auto) continue;
    if (st.auto) herzie(p.id);
    if (!S.autoAan) continue;
    const z = zekerheid(p);
    if (!z) continue;
    if (z.soort === "nvt" && !st.toelichting && z.tekst) { st.toelichting = z.tekst; st.autoToel = true; }
    if (z.soort === "ok" && p.welke && !st.toelichting) { const w = welkeTekst(p); if (w) { st.toelichting = w; st.autoToel = true; } }
    beslis(p.id, z.soort, { auto: true });
    n++;
  }
  return n;
}
function welkeTekst(p) {
  if (!p.welke) return "";
  const namen = objNrs(p).flatMap((o) => bewijsVan(p.id, o)).map((b) => b.naamN + " " + b.mapN);
  const lab = p.welke.filter(([re]) => namen.some((n) => re.test(n))).map(([, l]) => l);
  return lab.length ? `Aanwezig: ${lab.join(", ")}` : "";
}
function eersteOpen() { const i = PUNTEN.findIndex((p) => !S.punten[p.id].status); return i < 0 ? 0 : i; }

function tellingen() {
  const t = { totaal: PUNTEN.length, ok: 0, nvt: 0, mist: 0, deels: 0, open: 0, auto: 0, autoOk: 0 };
  for (const p of PUNTEN) { const st = S.punten[p.id]; const s = st?.status; if (s) { t[s]++; if (st.auto) { t.auto++; if (s === "ok") t.autoOk++; } } else t.open++; }
  t.klaar = t.totaal - t.open;
  return t;
}
function bewijsVan(pid, o) { return (S.punten[pid]?.gekozen[o] || []).map(B).filter(Boolean); }

/* Aandachtspunten die buiten de checklist vallen, maar wel opvallen. */
function aandachtspunten() {
  const uit = [];
  const tmp = S.bestanden.filter((b) => b.tijdelijk && !b.systeem);
  if (tmp.length) uit.push({ soort: "let", tekst: `${meervoud(tmp.length, "tijdelijk bestand", "tijdelijke bestanden")} in het dossier`, detail: tmp.slice(0, 3).map((b) => b.naam).join(", ") });
  const sj = S.bestanden.filter((b) => b.sjabloon);
  if (sj.length) uit.push({ soort: "let", tekst: `${meervoud(sj.length, "bestand heet", "bestanden heten")} ‘sjabloon’: controleer of ze zijn ingevuld`, detail: sj.slice(0, 3).map((b) => b.id).join(" · ") });
  const lang = padLengtes().filter((x) => x.lengte >= INSTELLINGEN.maxPad);
  if (lang.length) uit.push({ soort: "mis", tekst: `${meervoud(lang.length, "pad is", "paden zijn")} te lang (${INSTELLINGEN.maxPad}+ tekens)`, detail: lang[0].b.naam });
  return uit;
}

/* =====================================================================
   Voorbeeld van een bestand. Een echte map: pdf, foto, mail (.msg/.eml),
   Excel (tabbladen + eerste regels), Word, PowerPoint en zip. Een
   inventarisatie kent alleen namen: dan een bestandskaart. Voor de
   voorbeelddossiers tekent de tool een nagemaakt voorbeeld.
   ===================================================================== */

const VB = { token: 0, urls: [] };
function vbOpruimen() { VB.urls.forEach((u) => URL.revokeObjectURL(u)); VB.urls = []; }
function maakUrl(blob) { const u = URL.createObjectURL(blob); VB.urls.push(u); return u; }

const SOORTEN = {
  pdf: ["PDF", "pdf"], msg: ["Mail", "mail"], eml: ["Mail", "mail"],
  xlsx: ["Excel", "xl"], xlsm: ["Excel", "xl"], xlsb: ["Excel", "xl"], xls: ["Excel", "xl"], csv: ["CSV", "xl"],
  docx: ["Word", "wd"], doc: ["Word", "wd"], pptx: ["PPT", "pp"],
  jpg: ["Foto", "ft"], jpeg: ["Foto", "ft"], png: ["Beeld", "ft"], heic: ["Foto", "ft"], gif: ["Beeld", "ft"], webp: ["Beeld", "ft"], tif: ["Beeld", "ft"], tiff: ["Beeld", "ft"],
  zip: ["Zip", "zp"], lnk: ["Link", "zp"], url: ["Link", "zp"], tmp: ["Tmp", "tp"],
};
const soortVan = (ext) => SOORTEN[ext] || [ext ? ext.slice(0, 4).toUpperCase() : "?", "ov"];
const ftype = (b) => { const [k, c] = soortVan(b.ext); return `<span class="ft ft-${c}">${esc(k)}</span>`; };
const isBeeld = (ext) => ["jpg", "jpeg", "png", "gif", "webp", "bmp"].includes(ext);

function hashTekst(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function kruimels(map) { return map ? map.split("\\").map((d) => `<span>${esc(d)}</span>`).join('<i aria-hidden="true">›</i>') : '<span>(dossiermap)</span>'; }

/* ---------------- bestandskaart ---------------- */
function bestandKaart(b, melding = "") {
  const buren = S.bestanden.filter((x) => x.map === b.map && x.id !== b.id && !x.systeem).slice(0, 10);
  const meer = S.bestanden.filter((x) => x.map === b.map && x.id !== b.id && !x.systeem).length - buren.length;
  return `<div class="bkaart">
    <div class="bkkop">${ftype(b)}<div><div class="bknaam">${esc(b.naam)}</div><div class="kruimel">${kruimels(b.map)}</div></div></div>
    <dl class="bkfeiten">
      <div><dt>Grootte</dt><dd>${esc(grootteTekst(b.grootte)) || "—"}</dd></div>
      <div><dt>Gewijzigd</dt><dd>${b.gewijzigd ? esc(datumKort(b.gewijzigd) + ", " + tijdNL(b.gewijzigd)) : "—"}</dd></div>
      <div><dt>Alleen-lezen</dt><dd>${b.ro == null ? "onbekend" : b.ro ? "ja" : "nee"}</dd></div>
    </dl>
    ${melding ? `<p class="bkmelding">${melding}</p>` : ""}
    ${buren.length ? `<div class="bkburen"><div class="bklabel">Ook in deze map</div><ul>${buren.map((x) => `<li>${ftype(x)}<span>${esc(x.naam)}</span></li>`).join("")}</ul>${meer > 0 ? `<div class="bkmeer">en nog ${nl(meer)}</div>` : ""}</div>` : ""}
  </div>`;
}

/* ---------------- mail ---------------- */
function mailKaart(m, b) {
  const dt = m.datum ? `${datumLang(m.datum)}, ${tijdNL(m.datum)}` : "";
  const tekst = (m.tekst && m.tekst.trim()) ? m.tekst : (m.html ? htmlNaarTekst(m.html) : "");
  const bijl = (m.bijlagen || []).filter((x) => !x.inline);
  return `<div class="mail">
    <div class="mailkop">
      <div class="mailonderwerp">${esc(m.onderwerp || b.stam)}</div>
      <div class="mailrij"><span>Van</span><div><b>${esc(m.van || "—")}</b>${m.vanAdres && !/^\/o=/i.test(m.vanAdres) ? ` <em>&lt;${esc(m.vanAdres)}&gt;</em>` : ""}</div></div>
      ${m.aan ? `<div class="mailrij"><span>Aan</span><div>${esc(m.aan)}</div></div>` : ""}
      ${m.cc ? `<div class="mailrij"><span>Cc</span><div>${esc(m.cc)}</div></div>` : ""}
      ${dt ? `<div class="mailrij"><span>Datum</span><div>${esc(dt)}</div></div>` : ""}
      ${bijl.length ? `<div class="mailbijl">${bijl.slice(0, 12).map((x) => `<span class="bijl"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 01-7.1-7.1l8.6-8.6a3.5 3.5 0 015 5l-8.6 8.6a2 2 0 01-2.8-2.8l7.9-7.9"/></svg>${esc(x.naam)}${x.grootte ? ` <em>${esc(grootteTekst(x.grootte))}</em>` : ""}</span>`).join("")}</div>` : ""}
    </div>
    <div class="maillijf">${esc(tekst.slice(0, 8000)) || '<span class="zacht">Geen tekst in dit bericht.</span>'}</div>
  </div>`;
}

/* ---------------- Excel ---------------- */
function excelVak(vak, wm, p, b) {
  const zicht = wm.bladen.map((bl, i) => ({ ...bl, i })).filter((bl) => !bl.verborgen);
  const raak = p && p.tabbladen ? zicht.filter((bl) => p.tabbladen.test(bl.naam)) : [];
  let actief = (raak[0] || zicht[0] || { i: 0 }).i;
  const teken = async () => {
    const token = VB.token;
    vak.innerHTML = `<div class="xl">
      <div class="xlbalk">${raak.length ? `<span class="xlraak">${svgVink(12)} ${raak.length === 1 ? "Tabblad" : "Tabbladen"} gevonden: ${raak.map((r) => `<b>${esc(r.naam)}</b>`).join(", ")}</span>` : p && p.tabbladen ? `<span class="xlmis">Geen tabblad met een passende naam gevonden</span>` : `<span class="zacht">${meervoud(zicht.length, "tabblad", "tabbladen")}</span>`}</div>
      <div class="xltabs" role="tablist">${zicht.map((bl) => `<button role="tab" class="${bl.i === actief ? "aan" : ""} ${raak.includes(bl) ? "raak" : ""}" data-blad="${bl.i}">${esc(bl.naam)}</button>`).join("")}</div>
      <div class="xlrooster"><div class="vbladen">Regels lezen…</div></div>
    </div>`;
    $$(".xltabs button", vak).forEach((k) => k.addEventListener("click", () => { actief = +k.dataset.blad; teken(); }));
    let rijen = [];
    try { rijen = await wm.rijen(actief, 32, 12); } catch (e) { rijen = null; }
    if (token !== VB.token) return;
    const rooster = $(".xlrooster", vak);
    if (!rijen) { rooster.innerHTML = '<p class="zacht pad">Dit tabblad kan de tool niet lezen.</p>'; return; }
    if (!rijen.length) { rooster.innerHTML = '<p class="zacht pad">Dit tabblad is leeg.</p>'; return; }
    const kols = Math.max(1, ...rijen.map((r) => r.cellen.length));
    const letter = (i) => String.fromCharCode(65 + i);
    rooster.innerHTML = `<table class="xltab"><thead><tr><th></th>${Array.from({ length: kols }, (_, i) => `<th>${letter(i)}</th>`).join("")}</tr></thead><tbody>${rijen.map((r) => `<tr><th>${r.nr}</th>${Array.from({ length: kols }, (_, i) => { const v = r.cellen[i] ?? ""; return `<td class="${/^-?[\d.]+(,\d+)?%?$/.test(v) ? "g" : ""}">${esc(v)}</td>`; }).join("")}</tr>`).join("")}</tbody></table>`;
  };
  teken();
}

/* ---------------- tekstsoorten ---------------- */
function docxKaart(alineas, b) {
  const leeg = b.sjabloon || alineas.filter((a) => /\[[^\]]+\]|…|\.\.\.|xxx/i.test(a)).length >= 2;
  return `<div class="doc">${leeg ? `<div class="waarschuwing">${svgLet()}<span>Dit lijkt een sjabloon. Kijk of het echt is ingevuld.</span></div>` : ""}
    <div class="docvel">${alineas.length ? alineas.slice(0, 120).map((a, i) => (i === 0 && a.length < 90 ? `<h3>${esc(a)}</h3>` : `<p>${esc(a)}</p>`)).join("") : '<p class="zacht">Dit document is leeg.</p>'}</div></div>`;
}
function pptxKaart(dias) {
  return `<div class="doc"><div class="docvel">${dias.map((r, i) => `<div class="dia"><span class="dianr">Dia ${i + 1}</span>${r.map((t, j) => (j === 0 ? `<h3>${esc(t)}</h3>` : `<p>${esc(t)}</p>`)).join("") || '<p class="zacht">(geen tekst)</p>'}</div>`).join("")}</div></div>`;
}
function zipKaart(z, b) {
  const namen = z.namen().filter((n) => !n.endsWith("/"));
  return `<div class="doc"><div class="docvel"><h3>${esc(b.naam)}</h3><p class="zacht">Zip met ${meervoud(namen.length, "bestand", "bestanden")}</p><ul class="ziplijst">${namen.slice(0, 60).map((n) => `<li>${esc(n)}</li>`).join("")}</ul>${namen.length > 60 ? `<p class="zacht">en nog ${nl(namen.length - 60)}</p>` : ""}</div></div>`;
}

/* ---------------- hoofdingang ---------------- */
async function toonVoorbeeld(vak, b, p) {
  const token = ++VB.token;
  vbOpruimen();
  if (!b) { vak.innerHTML = `<div class="vbleeg">${svgBestand(28)}<b>Geen bestand gekozen</b><span>Kies links een bestand, of zoek er een met ‘Ander bestand’.</span></div>`; return; }
  if (b.demo) { demoVoorbeeld(vak, b, p); return; }
  if (!heeftInhoud(b)) {
    vak.innerHTML = bestandKaart(b, S.bron?.soort === "inventaris" ? "Dit dossier komt uit een inventarisatie: de tool kent alleen de naam. Kies de map zelf om het bestand te zien." : "");
    return;
  }
  vak.innerHTML = '<div class="vbladen">Voorbeeld laden…</div>';
  try {
    const f = await haalFile(b);
    if (b.grootte == null && f) { b.grootte = f.size; b.gewijzigd = new Date(f.lastModified); }
    if (token !== VB.token) return;
    const e = b.ext;
    if (e === "pdf") {
      vak.innerHTML = `<iframe class="vbpdf" src="${maakUrl(f)}#view=FitH&navpanes=0" title="${esc(b.naam)}"></iframe>`;
    } else if (isBeeld(e)) {
      vak.innerHTML = `<div class="vbbeeld"><img src="${maakUrl(f)}" alt="${esc(b.naam)}"></div>`;
    } else if (e === "msg") {
      vak.innerHTML = mailKaart(leesMsg(await f.arrayBuffer()), b);
    } else if (e === "eml") {
      vak.innerHTML = mailKaart(leesEml(await f.arrayBuffer()), b);
    } else if (["xlsx", "xlsm", "xltx", "xltm"].includes(e)) {
      excelVak(vak, await Xlsx.open(f), p, b);
    } else if (["docx", "dotx", "docm"].includes(e)) {
      vak.innerHTML = docxKaart(await leesDocx(f), b);
    } else if (e === "pptx") {
      vak.innerHTML = pptxKaart(await leesPptx(f));
    } else if (e === "zip") {
      vak.innerHTML = zipKaart(await Zip.open(f), b);
    } else if (["txt", "csv", "log", "json", "xml", "md"].includes(e)) {
      vak.innerHTML = `<div class="doc"><pre class="docpre">${esc(await f.slice(0, 60000).text())}</pre></div>`;
    } else {
      vak.innerHTML = bestandKaart(b, e === "heic" || e === "heif" ? "HEIC-foto’s kan de browser niet tonen." : "Van dit soort bestand kan de tool geen voorbeeld laten zien.");
    }
  } catch (err) {
    if (token === VB.token) vak.innerHTML = bestandKaart(b, `Geen voorbeeld: ${esc(err.message || err)}`);
  }
}

/* Foto's: een raster van wat er gekozen is. */
function toonFotos(vak, bs) {
  ++VB.token; vbOpruimen();
  const beelden = bs.filter((b) => isBeeld(b.ext) || b.ext === "heic");
  const rest = bs.filter((b) => !beelden.includes(b));
  vak.innerHTML = `<div class="fotos">
    <div class="fotokop"><b>${meervoud(beelden.length, "foto", "foto’s")}</b>${rest.length ? `<span>${rest.map((b) => esc(b.naam)).join(", ")}</span>` : ""}</div>
    <div class="fotoraster">${beelden.slice(0, 30).map((b, i) => `<figure class="foto">${b.demo ? demoFoto(b) : heeftInhoud(b) && isBeeld(b.ext) ? `<img data-fi="${i}" alt="${esc(b.naam)}" loading="lazy">` : `<div class="fotoleeg">${esc(b.ext.toUpperCase())}</div>`}<figcaption>${esc(b.naam)}</figcaption></figure>`).join("")}</div>
    ${beelden.length > 30 ? `<p class="zacht pad">en nog ${nl(beelden.length - 30)} foto’s</p>` : ""}
  </div>`;
  beelden.slice(0, 30).forEach(async (b, i) => {
    if (b.demo || !heeftInhoud(b) || !isBeeld(b.ext)) return;
    try { const f = await haalFile(b); const img = $(`img[data-fi="${i}"]`, vak); if (img) img.src = maakUrl(f); } catch {}
  });
}

      0: [["Object", c.adres], ["Dossier", `${c.nr}-${c.versie}`], ["Waardepeildatum", "15-10-2026"], ["Marktwaarde k.k.", "4.350.000"], ["Markthuur p.j.", "312.400"], ["BAR", "7,18%"], ["NAR", "6,05%"]],
      3: [["Referentie", "Plaats", "Datum", "m² VVO", "Huur p.j.", "€/m²"], ["Havenkade 22", c.plaats || "Zwolle", "05-2026", "640", "107.520", "168"], ["Kranenburg 3", c.plaats || "Zwolle", "02-2026", "910", "145.600", "160"], ["Stationsweg 14", c.plaats || "Zwolle", "11-2025", "1.120", "190.400", "170"], ["Hanzeweg 8", "Kampen", "09-2025", "780", "117.000", "150"], ["", "", "", "", "Gemiddeld", "162"], ["", "", "", "", "Gehanteerd", "165"]],
    };
  } else if (/inspect/.test(n)) {
    bladen = ["Inspectie", "Technische staat", "Foto-overzicht"];
    data = { 0: [["Datum inspectie", datumNL(c.datum)], ["Taxateur", c.t2], ["Aanwezig", "beheerder"], ["Bouwjaar", "1998"], ["Onderhoudsstaat", "goed"], ["Bijzonderheden", "dakbedekking vervangen in 2021"]] };
  } else if (/\besg\b/.test(n)) {
    bladen = ["ESG-scan", "Toelichting"];
    data = { 0: [["Criterium", "Uitkomst", "Score"], ["Energielabel", "B", "7"], ["Paris Proof", "nee", "3"], ["Hittestress", "laag", "8"], ["Overstromingsrisico", "laag", "8"], ["Totaal", "", "62"]] };
  } else if (/huurlijst/.test(n)) {
    bladen = ["Huurlijst"];
    data = { 0: [["Object", "Unit", "Huurder", "Huur p.j."], ...S.objecten.map((o, i) => [o.adres || o.nr, `${i + 1}`, "particulier", nl(14000 + i * 1300)])] };
  } else { bladen = ["Blad1"]; data = { 0: [["Omschrijving", "Waarde"], ["—", "—"]] }; }
  return {
    bladen: bladen.map((naam) => ({ naam, verborgen: false })),

}
